# ═══════════════════════════════════════════════════════════════════════════════
# Nightly Suite — Comprehensive test coverage + data integrity
# CI Architecture Redesign — absorbs data-audit.yml into nightly schedule
# ═══════════════════════════════════════════════════════════════════════════════
# Runs explicit public and local-emulator-authenticated Playwright suites,
# full unit test coverage, and a separate data integrity audit. Authenticated
# browser coverage fails closed when the verified local emulator is unavailable.
#
# Target runtime: < 30 minutes for the browser job (jobs run in parallel)
# ═══════════════════════════════════════════════════════════════════════════════

name: Nightly Suite

on:
  schedule:
    - cron: "0 2 * * *" # 2:00 UTC daily
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: true # Only latest nightly matters

env:
  BASELINE_COMPREHENSIVE: 900
  BASELINE_DATA_AUDIT: 300
  PHASE5A1_CATALOG: "1"
  PHASE5A2_CROSS_BROWSER: "true"
  PHASE5A1_CATALOG_SOURCE_SHA: ${{ github.sha }}
  PHASE5A1_CATALOG_PR_HEAD_SHA: ${{ github.sha }}

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # Job 1: Full frontend test suite (unit + explicit safe browser modes)
  # ─────────────────────────────────────────────────────────────────────────
  comprehensive:
    name: Full Test Suite
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 30
    env:
      # Main owns its exact report history. Feature-branch dispatches compare
      # against the independently fetched main merge base.
      PHASE5_LIVE_INVENTORY_BASE_SHA: ${{ github.ref == 'refs/heads/main' && github.sha || '' }}
      VISUAL_SAFETY_APP_ORIGIN: http://127.0.0.1:3000
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Record job start
        id: timer
        run: echo "start=$(date +%s)" >> "$GITHUB_OUTPUT"
        working-directory: .

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Preserve report-introduction history for provenance verification.
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Cache Next.js build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: frontend/.next/cache
          key: next-cache-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}-${{ hashFiles('frontend/src/**') }}
          restore-keys: |
            next-cache-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}-
            next-cache-${{ runner.os }}-

      - name: Build
        run: npm run build
        timeout-minutes: 5

      - name: Unit tests with coverage
        run: npx vitest run --coverage
        timeout-minutes: 7

      - name: Get Playwright version
        id: pw-version
        run: echo "version=$(node -e "console.log(require('@playwright/test/package.json').version)")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: pw-all-engines-${{ runner.os }}-${{ steps.pw-version.outputs.version }}

      - name: Install Playwright browsers
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium firefox webkit
        timeout-minutes: 8

      - name: Install Playwright system deps
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium firefox webkit
        timeout-minutes: 8

      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v1

      - name: Public visual-safety preflight
        run: npm run visual-safety:preflight
        env:
          VISUAL_SAFETY_MODE: public
          BASE_URL: http://127.0.0.1:3000

      - name: Public Playwright suite
        run: |
          set -o pipefail
          npm run visual-safety:public -- --project=smoke --retries=0 --reporter=list 2>&1 | tee ../playwright-public-stdout.log
        timeout-minutes: 20
        env:
          VISUAL_SAFETY_MODE: public
          BASE_URL: http://127.0.0.1:3000
          NEXT_PUBLIC_QA_MODE: "1"

      - name: Assert public visual safety
        id: public_safety_assert
        if: ${{ always() }}
        run: npm run visual-safety:assert
        env:
          VISUAL_SAFETY_MODE: public
          BASE_URL: http://127.0.0.1:3000

      - name: Start ephemeral local Supabase
        id: local_supabase_start
        working-directory: .
        run: bash frontend/e2e/scripts/local-supabase-ci.sh start

      # Existing authenticated coverage remains blocking, but may run only
      # after the guarded preflight proves the configured local emulator.
      - name: Local-authenticated visual-safety preflight (blocking)
        id: auth_preflight
        run: npm run visual-safety:preflight
        env:
          VISUAL_SAFETY_MODE: local-authenticated
          BASE_URL: http://127.0.0.1:3000

      - name: Seed guarded local QA fixtures
        id: local_fixture_seed
        shell: bash
        run: |
          fixture_ids="$RUNNER_TEMP/tryvit-qa-fixture-ids.env"
          npm run --silent visual-safety:fixtures-seed > "$fixture_ids"
          if ! grep -Eq '^QA_PRODUCT_ID=[0-9]+$' "$fixture_ids"; then
            rm -f -- "$fixture_ids"
            echo "::error::Guarded local fixture seeding did not return deterministic IDs"
            exit 1
          fi
          grep -E '^QA_[A-Z_]+=[A-Za-z0-9_-]+$' "$fixture_ids" >> "$GITHUB_ENV"
          rm -f -- "$fixture_ids"
          echo "seeded=true" >> "$GITHUB_OUTPUT"

      - name: Local-authenticated Playwright suite
        id: local_authenticated_suite
        run: |
          set -o pipefail
          npm run visual-safety:local-authenticated -- --project=authenticated --project=functional --project=private-pwa-cache --project=phase5a1-catalog --project=phase5a2-primitives-firefox --project=phase5a2-primitives-webkit --retries=0 --reporter=list 2>&1 | tee ../playwright-authenticated-stdout.log
        timeout-minutes: 20
        env:
          VISUAL_SAFETY_MODE: local-authenticated
          BASE_URL: http://127.0.0.1:3000
          NEXT_PUBLIC_QA_MODE: "1"

      - name: Verify Phase 5A.1 catalog candidate manifest
        id: catalog_candidates
        if: ${{ !cancelled() && steps.local_authenticated_suite.outcome == 'success' }}
        run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON --experimental-strip-types tooling/design-system/catalog/verify-candidates.mts

      - name: Assert local-authenticated visual safety
        id: auth_safety_assert
        if: ${{ always() && steps.auth_preflight.outcome == 'success' }}
        run: npm run visual-safety:assert
        env:
          VISUAL_SAFETY_MODE: local-authenticated
          BASE_URL: http://127.0.0.1:3000

      - name: Teardown guarded local QA fixtures
        id: local_fixture_teardown
        if: ${{ always() && steps.local_fixture_seed.outputs.seeded == 'true' }}
        run: npm run --silent visual-safety:fixtures-teardown

      - name: Stop ephemeral local Supabase (no backup)
        id: local_supabase_stop
        if: ${{ always() }}
        working-directory: .
        run: bash frontend/e2e/scripts/local-supabase-ci.sh stop

      - name: Upload Playwright report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() && steps.public_safety_assert.outcome == 'success' && steps.auth_safety_assert.outcome == 'success' && steps.local_fixture_teardown.outcome == 'success' && steps.local_supabase_stop.outcome == 'success' }}
        with:
          name: nightly-playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
            !frontend/test-results/phase5a1-catalog-candidates/**
            !frontend/test-results/phase5a1-catalog-diagnostics/**
            playwright-public-stdout.log
            playwright-authenticated-stdout.log
          retention-days: 30

      - name: Upload Phase 5A.1 catalog candidates
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ always() && steps.catalog_candidates.outcome == 'success' && steps.public_safety_assert.outcome == 'success' && steps.auth_safety_assert.outcome == 'success' && steps.local_fixture_teardown.outcome == 'success' && steps.local_supabase_stop.outcome == 'success' }}
        with:
          name: nightly-phase5a1-catalog-candidates
          path: frontend/test-results/phase5a1-catalog-candidates/
          retention-days: 30
          if-no-files-found: error

      - name: Upload Phase 5A.1 catalog diagnostics
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ always() && steps.public_safety_assert.outcome == 'success' && steps.auth_safety_assert.outcome == 'success' && steps.local_fixture_teardown.outcome == 'success' && steps.local_supabase_stop.outcome == 'success' }}
        with:
          name: nightly-phase5a1-catalog-diagnostics
          path: frontend/test-results/phase5a1-catalog-diagnostics/
          retention-days: 30
          if-no-files-found: ignore

      - name: Alert on comprehensive failure
        if: failure()
        env:
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
        run: |
          if [ -n "$ALERT_WEBHOOK_URL" ]; then
            curl -sf -X POST "$ALERT_WEBHOOK_URL" \
              -H 'Content-Type: application/json' \
              -d '{"text": "Nightly comprehensive tests FAILED \u2014 https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"}'
          fi
        working-directory: .

      - name: CI runtime summary
        if: ${{ !cancelled() }}
        working-directory: .
        run: |
          end=$(date +%s); start=${{ steps.timer.outputs.start }}; d=$((end-start))
          echo "## Nightly Comprehensive: $((d/60))m $((d%60))s" >> "$GITHUB_STEP_SUMMARY"
          pct=0; [ "$BASELINE_COMPREHENSIVE" -gt 0 ] && pct=$(( (d-BASELINE_COMPREHENSIVE)*100/BASELINE_COMPREHENSIVE ))
          [ "$pct" -gt 30 ] && echo "::warning::Nightly comprehensive regression: ${d}s (+${pct}% vs ${BASELINE_COMPREHENSIVE}s)"
          mkdir -p ci-timings
          echo '{"job":"comprehensive","duration_seconds":'$d',"baseline_seconds":'$BASELINE_COMPREHENSIVE',"delta_pct":'$pct'}' > ci-timings/comprehensive.json

      - name: Upload CI timings
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-timings-comprehensive
          path: ci-timings/
          retention-days: 30

  # ─────────────────────────────────────────────────────────────────────────
  # Job 2: Data Integrity Audit (runs in parallel with comprehensive)
  # Absorbed from the former data-audit.yml
  # ─────────────────────────────────────────────────────────────────────────
  data-audit:
    name: Data Integrity Audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15

    steps:
      - name: Record job start
        id: timer
        run: echo "start=$(date +%s)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: "pip"

      - run: pip install -r requirements.txt

      - name: Run Data Integrity Audit
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || secrets.SUPABASE_URL_STAGING || secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY || secrets.SUPABASE_SERVICE_ROLE_KEY_STAGING || secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_KEY" ]; then
            echo "::warning::Data integrity audit skipped — SUPABASE_URL or SUPABASE_SERVICE_KEY secret not configured"
            exit 0
          fi
          python run_data_audit.py

      - name: Upload Audit Report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: data-audit-report
          path: audit-reports/
          retention-days: 90

      - name: Post Summary
        if: always()
        run: |
          REPORT=$(cat audit-reports/audit_*.json 2>/dev/null || echo '{}')
          CRITICAL=$(echo "$REPORT" | python3 -c "import sys,json; print(json.load(sys.stdin).get('summary',{}).get('critical',0))" 2>/dev/null || echo "?")
          WARNINGS=$(echo "$REPORT" | python3 -c "import sys,json; print(json.load(sys.stdin).get('summary',{}).get('warnings',0))" 2>/dev/null || echo "?")
          INFO=$(echo "$REPORT" | python3 -c "import sys,json; print(json.load(sys.stdin).get('summary',{}).get('info',0))" 2>/dev/null || echo "?")
          TOTAL=$(echo "$REPORT" | python3 -c "import sys,json; print(json.load(sys.stdin).get('summary',{}).get('total_findings',0))" 2>/dev/null || echo "?")
          echo "## Data Integrity Audit" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Severity | Count |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| 🔴 Critical | $CRITICAL |" >> $GITHUB_STEP_SUMMARY
          echo "| 🟠 Warning | $WARNINGS |" >> $GITHUB_STEP_SUMMARY
          echo "| 🔵 Info | $INFO |" >> $GITHUB_STEP_SUMMARY
          echo "| **Total** | **$TOTAL** |" >> $GITHUB_STEP_SUMMARY

      - name: Alert on Critical Findings
        if: failure()
        env:
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
        run: |
          if [ -n "$ALERT_WEBHOOK_URL" ]; then
            curl -sf -X POST "$ALERT_WEBHOOK_URL" \
              -H 'Content-Type: application/json' \
              -d '{"text": "Nightly audit: CRITICAL issues — https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"}'
          fi

      - name: CI runtime summary
        if: ${{ !cancelled() }}
        run: |
          end=$(date +%s); start=${{ steps.timer.outputs.start }}; d=$((end-start))
          echo "## Data Audit: $((d/60))m $((d%60))s" >> "$GITHUB_STEP_SUMMARY"
          pct=0; [ "$BASELINE_DATA_AUDIT" -gt 0 ] && pct=$(( (d-BASELINE_DATA_AUDIT)*100/BASELINE_DATA_AUDIT ))
          [ "$pct" -gt 30 ] && echo "::warning::Data audit regression: ${d}s (+${pct}% vs ${BASELINE_DATA_AUDIT}s)"
          mkdir -p ci-timings
          echo '{"job":"data-audit","duration_seconds":'$d',"baseline_seconds":'$BASELINE_DATA_AUDIT',"delta_pct":'$pct'}' > ci-timings/data-audit.json

      - name: Upload CI timings
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-timings-data-audit
          path: ci-timings/
          retention-days: 30
