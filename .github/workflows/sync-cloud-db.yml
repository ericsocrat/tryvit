name: Sync Cloud DB (retired)
# Kept as an explicit compatibility notice; no second mutation entrypoint.
# Automatic staging sync must not apply an unreviewed set of pending migrations.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  retired:
    name: Use manifest-bound Deploy Database
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - run: |
          echo "::error::This entrypoint is retired. Use Deploy Database with exact source SHA, migration manifest, staging evidence, and recovery receipt."
          exit 1
