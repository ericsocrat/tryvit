name: QA Tests

on:
  push:
    branches: [main]
    paths:
      - "db/**"
      - "supabase/**"
      - "pipeline/**"
      - "RUN_QA.ps1"
      - "RUN_LOCAL.ps1"
      - "RUN_SEED.ps1"
      - "RUN_SANITY.ps1"
      - "validate_eans.py"
      - "enrich_ingredients.py"
      - "check_enrichment_identity.py"
      - "check_pipeline_structure.py"
      - "data_quality_report.py"
      - "test_data_quality_report.py"
      - "data-quality/**"
      - "fetch_off_category.py"
      - ".github/workflows/qa.yml"
  pull_request:
    branches: [main]
    paths:
      - "db/**"
      - "supabase/**"
      - "pipeline/**"
      - "validate_eans.py"
      - "enrich_ingredients.py"
      - "check_enrichment_identity.py"
      - "check_pipeline_structure.py"
      - "data_quality_report.py"
      - "test_data_quality_report.py"
      - "data-quality/**"
      - "fetch_off_category.py"
      - "RUN_QA.ps1"
      - "RUN_LOCAL.ps1"
      - "RUN_SEED.ps1"
      - "RUN_SANITY.ps1"
      - ".github/workflows/qa.yml"
  workflow_dispatch:
    inputs:
      fail_on_warn:
        description: "Treat informational warnings as failures"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: qa-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  qa:
    name: DB Integrity
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres # NOSONAR — ephemeral CI-only container
          POSTGRES_DB: postgres
        ports:
          - 54322:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5

    env:
      PGHOST: localhost
      PGPORT: 54322
      PGUSER: postgres
      PGPASSWORD: postgres # NOSONAR — ephemeral CI-only container
      PGDATABASE: postgres

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Data-quality report unit tests
        run: python -m unittest test_data_quality_report.py

      - name: Deterministic enrichment unit tests
        run: python -m unittest pipeline.test_enrichment pipeline.test_enrichment_governance pipeline.test_phase4d

      - name: Deterministic enrichment generated-output check
        run: |
          python -m pipeline.generate_enrichment_pilot --check --stats-json
          python -m pipeline.generate_enrichment_pilot \
            --manifest phase4b \
            --check \
            --stats-json
          python -m pipeline.generate_enrichment_pilot \
            --manifest phase4d \
            --check \
            --stats-json

      - name: Deterministic enrichment governance report check
        run: python -m pipeline.governance_report --check

      - name: Enrichment identity guard
        run: |
          set -euo pipefail
          python check_enrichment_identity.py

      - name: Pipeline structure guard
        run: |
          set -euo pipefail
          python check_pipeline_structure.py

      - name: Apply schema migrations
        run: |
          set -euo pipefail
          # Include "extensions" schema in search_path so that functions
          # installed there (e.g. pgcrypto's digest()) are visible without
          # schema-qualification — mirrors the Supabase CLI default.
          psql -c "ALTER DATABASE postgres SET search_path TO public, extensions;"

          # CI builds from scratch: enrichment migrations create ingredient_refs
          # but can't populate product_ingredient (products don't exist yet).
          # The orphan cleanup migration then incorrectly deletes those
          # ingredient_refs as "orphans". The enrichment replay later fails
          # because product_ingredient references the deleted ingredient_ids.
          # Replace with a no-op; ci_post_enrichment.sql handles orphan cleanup
          # after enrichment replay (Step 0d).
          echo '-- CI: skipped (orphan cleanup deferred to ci_post_enrichment.sql)' \
            > supabase/migrations/20260316000700_cleanup_orphan_ingredient_refs.sql

          while IFS= read -r -d '' f; do
            echo "Applying: $f"
            psql -v ON_ERROR_STOP=1 -f "$f"
          done < <(find supabase/migrations -maxdepth 1 -type f -name '*.sql' -print0 | sort -z)

      - name: Run pipelines
        run: |
          set -euo pipefail
          while IFS= read -r -d '' f; do
            if grep -Eq '^-- Phase: 4(B|D)$' "$f"; then
              echo "  DEFER $f"
              continue
            fi
            echo "  RUN  $f"
            psql -v ON_ERROR_STOP=1 -f "$f"
          done < <(find db/pipelines -mindepth 2 -maxdepth 2 \
            -type f -name 'PIPELINE__*.sql' -print0 | sort -z)

      - name: Replay enrichment data
        run: |
          set -euo pipefail
          # Enrichment migrations run BEFORE pipelines, so their JOINs on
          # products(country, ean) match zero rows.  Re-run them now that
          # pipelines have populated the products table.
          #
          # PL enrichment: safe — resolves product_id + ingredient_id via JOINs
          # DE enrichment: ingredient_ids are hardcoded but deterministic (same
          #   serial values from identical migration ordering)
          # Both use ON CONFLICT DO NOTHING — fully idempotent.
          #
          # The allergen FK constraint (fk_allergen_tag_ref) must be dropped
          # before replay because the enrichment files use raw en:-prefixed tags.
          # ci_normalize_allergens.sql re-normalizes and re-adds the FK.

          echo "Dropping allergen FK for enrichment replay..."
          psql -v ON_ERROR_STOP=1 -c \
            "ALTER TABLE product_allergen_info DROP CONSTRAINT IF EXISTS fk_allergen_tag_ref;"

          echo "Replaying PL enrichment (20260215141000)..."
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260215141000_populate_ingredients_allergens.sql

          echo "Replaying DE enrichment (20260309000100)..."
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260309000100_de_enrichment_ingredients_allergens.sql

          echo "Normalizing allergen tags and re-adding FK..."
          psql -v ON_ERROR_STOP=1 -f db/ci_normalize_allergens.sql

          echo "Computing concern scores and re-scoring all categories..."
          psql -v ON_ERROR_STOP=1 -f db/ci_post_enrichment.sql

          echo "Applying the canonical post-pipeline fixup before the Phase 4B baseline..."
          psql -v ON_ERROR_STOP=1 -f db/ci_post_pipeline.sql

          echo "Reproducing the Phase 4B candidate ranking and before snapshot..."
          python -m pipeline.category_enrichment_report --stage before --check

          echo "Applying deferred Phase 4B category enrichment..."
          while IFS= read -r -d '' f; do
            if grep -q '^-- Phase: 4B$' "$f"; then
              echo "  PHASE4B $f"
              psql -v ON_ERROR_STOP=1 -f "$f"
            fi
          done < <(find db/pipelines -mindepth 2 -maxdepth 2 \
            -type f -name 'PIPELINE__*.sql' -print0 | sort -z)
          psql -v ON_ERROR_STOP=1 -f db/ci_post_enrichment.sql
          psql -v ON_ERROR_STOP=1 -f db/ci_post_pipeline.sql
          python -m pipeline.category_enrichment_report \
            --stage snapshot

          echo "Rerunning Phase 4B to prove idempotency..."
          while IFS= read -r -d '' f; do
            if grep -q '^-- Phase: 4B$' "$f"; then
              psql -v ON_ERROR_STOP=1 -f "$f"
            fi
          done < <(find db/pipelines -mindepth 2 -maxdepth 2 \
            -type f -name 'PIPELINE__*.sql' -print0 | sort -z)
          psql -v ON_ERROR_STOP=1 -f db/ci_post_enrichment.sql
          psql -v ON_ERROR_STOP=1 -f db/ci_post_pipeline.sql
          python -m pipeline.category_enrichment_report \
            --stage report \
            --check

          echo "Reproducing the Phase 4D candidate ranking and before snapshot..."
          python -m pipeline.phase4d_report --stage before --check

          echo "Applying deferred Phase 4D category enrichment..."
          while IFS= read -r -d '' f; do
            if grep -q '^-- Phase: 4D$' "$f"; then
              echo "  PHASE4D $f"
              psql -v ON_ERROR_STOP=1 -f "$f"
            fi
          done < <(find db/pipelines -mindepth 2 -maxdepth 2 \
            -type f -name 'PIPELINE__*.sql' -print0 | sort -z)
          psql -v ON_ERROR_STOP=1 -f db/ci_post_phase4d.sql
          python -m pipeline.phase4d_report --stage snapshot

          echo "Rerunning Phase 4D to prove idempotency..."
          while IFS= read -r -d '' f; do
            if grep -q '^-- Phase: 4D$' "$f"; then
              psql -v ON_ERROR_STOP=1 -f "$f"
            fi
          done < <(find db/pipelines -mindepth 2 -maxdepth 2 \
            -type f -name 'PIPELINE__*.sql' -print0 | sort -z)
          psql -v ON_ERROR_STOP=1 -f db/ci_post_phase4d.sql
          python -m pipeline.phase4d_report --stage report --check

          echo "Enrichment replay complete."
          # Verify data arrived
          counts=$(psql --tuples-only --no-align -c "
            SELECT 'product_ingredient=' || (SELECT count(*) FROM product_ingredient)
                || ' product_allergen_info=' || (SELECT count(*) FROM product_allergen_info)
                || ' ingredient_ref=' || (SELECT count(*) FROM ingredient_ref);
          ")
          echo "Enrichment row counts: $counts"

      - name: Schema drift detection
        run: |
          set -euo pipefail
          # Verify there are no unexpected test functions left in public schema.
          # (The table subquery comparing pg_tables vs information_schema was a
          #  no-op: both catalog views show the same rows. Removed in CI noise
          #  reduction pass.)
          orphans=$(psql --tuples-only --no-align -c "
            SELECT 'FUNCTION: ' || routine_name FROM information_schema.routines
            WHERE routine_schema = 'public'
              AND routine_type = 'FUNCTION'
              AND routine_name LIKE 'test_%'
          " 2>&1 || true)
          orphans_trimmed=$(echo "$orphans" | sed '/^$/d')
          if [ -n "$orphans_trimmed" ]; then
            echo "::warning::Potential schema drift detected:"
            echo "$orphans_trimmed"
          else
            echo "✓ No schema drift detected"
          fi

      - name: Generate data-quality report
        id: data_quality
        run: |
          set +e
          python data_quality_report.py \
            --config data-quality/thresholds.json \
            --baseline data-quality/baselines/ci-v1.json \
            --dataset-id deterministic-ci-qa-v1 \
            --environment ci \
            --json-out data-quality-report.json \
            --markdown-out data-quality-report.md
          exit_code=$?
          set -e
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"
          if [ "$exit_code" -ne 0 ]; then
            echo "::warning::Data-quality gate exited with code $exit_code"
          fi

      - name: Upload data-quality report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: data-quality-report
          path: |
            data-quality-report.json
            data-quality-report.md
          retention-days: 30
          if-no-files-found: error

      - name: Add data-quality summary
        if: always()
        shell: pwsh
        run: |
          if (Test-Path 'data-quality-report.md') {
            Get-Content 'data-quality-report.md' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          } else {
            "## TryVit data-quality report`n`n[FAIL] Report was not generated." | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          }

      - name: Scoring diagnostic
        if: always()
        run: |
          echo "=== Anchor product scores ==="
          psql --tuples-only -c "
            SELECT p.product_id, p.brand, p.product_name, p.category, p.country,
                   p.unhealthiness_score, p.ingredient_concern_score, p.controversies,
                   (SELECT COUNT(*) FROM product_ingredient pi WHERE pi.product_id = p.product_id) AS pi_count,
                   (SELECT COUNT(*) FILTER (WHERE ir2.is_additive)
                    FROM product_ingredient pi2
                    JOIN ingredient_ref ir2 ON ir2.ingredient_id = pi2.ingredient_id
                    WHERE pi2.product_id = p.product_id) AS additive_count
            FROM products p
            WHERE (p.product_name = 'Doriros Sweet Chili Flavoured 100g' AND p.brand = 'Doritos')
               OR (p.product_name = 'Coca-Cola Zero' AND p.country = 'DE')
               OR (p.product_name = 'Tortilla Pszenno-Żytnia' AND p.brand = 'Auchan')
               OR (p.product_name = 'Czekolada Tiramisu' AND p.brand = 'E. Wedel')
               OR (p.product_name = 'Noodles Chicken Flavour' AND p.brand = 'Indomie')
            ORDER BY p.product_name;
          "

      - name: Confidence distribution diagnostic
        if: always()
        run: |
          echo "=== Confidence band distribution ==="
          psql -c "
            SELECT confidence_band, COUNT(*) AS products,
                   ROUND(100.0 * COUNT(*) / SUM(COUNT(*)) OVER (), 1) AS pct
            FROM v_product_confidence
            GROUP BY confidence_band
            ORDER BY MIN(total_confidence) DESC;
          "
          echo ""
          echo "=== Confidence component averages ==="
          psql -c "
            SELECT ROUND(AVG(nutrition_pts), 1)  AS avg_nutrition,
                   ROUND(AVG(ingredient_pts), 1)  AS avg_ingredient,
                   ROUND(AVG(source_pts), 1)       AS avg_source,
                   ROUND(AVG(ean_pts), 1)          AS avg_ean,
                   ROUND(AVG(allergen_pts), 1)     AS avg_allergen,
                   ROUND(AVG(total_confidence), 1) AS avg_total
            FROM v_product_confidence;
          "
          echo ""
          echo "=== products.confidence text enum distribution ==="
          psql -c "
            SELECT confidence, COUNT(*) AS products
            FROM products
            WHERE is_deprecated IS NOT TRUE
            GROUP BY confidence
            ORDER BY confidence;
          "

      - name: Run QA via RUN_QA.ps1
        id: qa
        shell: pwsh
        run: |
          $failOnWarn = '${{ inputs.fail_on_warn }}' -eq 'true'
          if ($failOnWarn) {
            & ./RUN_QA.ps1 -Json -OutFile qa.json -FailOnWarn
          } else {
            & ./RUN_QA.ps1 -Json -OutFile qa.json
          }
          $exitCode = $LASTEXITCODE
          # Write exit code for downstream steps
          "qa_exit_code=$exitCode" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          # Don't fail yet — let summary + artifact steps run
          if ($exitCode -ne 0) {
            Write-Host "::warning::QA exited with code $exitCode"
          }

      - name: Upload QA results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qa-results
          path: qa.json
          retention-days: 30

      - name: Run sanity checks
        shell: pwsh
        run: |
          & ./RUN_SANITY.ps1 -Env local -Json -OutFile sanity.json
          $exitCode = $LASTEXITCODE
          if ($exitCode -ne 0) {
            Write-Host "::warning::Sanity checks exited with code $exitCode"
          }

      - name: Upload sanity results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sanity-results
          path: sanity.json
          retention-days: 30
          if-no-files-found: ignore

      - name: Generate QA summary
        if: always()
        shell: pwsh
        run: |
          if (-not (Test-Path 'qa.json')) {
            "## QA Summary`n`n:x: qa.json not found — QA step may have failed to start." | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            exit 0
          }
          $qa = Get-Content 'qa.json' -Raw | ConvertFrom-Json
          $sb = [System.Text.StringBuilder]::new()
          [void]$sb.AppendLine("## QA Summary")
          [void]$sb.AppendLine("")
          [void]$sb.AppendLine("| Suite | ID | Checks | Status | Runtime |")
          [void]$sb.AppendLine("|-------|----|--------|--------|---------|")
          foreach ($s in $qa.suites) {
            $icon = switch ($s.status) {
              'pass' { ':white_check_mark:' }
              'fail' { ':x:' }
              'warn' { ':warning:' }
              'error' { ':boom:' }
              default { ':grey_question:' }
            }
            $rt = if ($s.runtime_ms) { "$($s.runtime_ms) ms" } else { '—' }
            [void]$sb.AppendLine("| $($s.name) | ``$($s.suite_id)`` | $($s.checks) | $icon $($s.status) | $rt |")
          }
          [void]$sb.AppendLine("")
          [void]$sb.AppendLine("**Overall: $($qa.overall)** — $($qa.summary.passed) passed, $($qa.summary.failed) failed, $($qa.summary.warnings) warnings")
          [void]$sb.AppendLine("")
          [void]$sb.AppendLine("*Schema version: $($qa.version) · Timestamp: $($qa.timestamp)*")
          $sb.ToString() | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append

      - name: Fail if QA or data quality failed
        if: always()
        shell: pwsh
        run: |
          $failed = $false
          if (-not (Test-Path 'qa.json')) {
            Write-Host "::error::qa.json was not generated"
            $failed = $true
          }
          if (-not (Test-Path 'data-quality-report.json')) {
            Write-Host "::error::data-quality-report.json was not generated"
            $failed = $true
          }
          if ($failed) { exit 1 }
          $qa = Get-Content 'qa.json' -Raw | ConvertFrom-Json
          if ($qa.overall -eq 'fail') {
            Write-Host "::error::QA FAILED — $($qa.summary.failed) check(s) failed"
            $failed = $true
          }
          if ($qa.overall -eq 'warn') {
            Write-Host "::warning::QA passed with warnings ($($qa.summary.warnings) flagged items)"
            # Only fail on warn if explicitly requested
            $failOnWarn = '${{ inputs.fail_on_warn }}' -eq 'true'
            if ($failOnWarn) { $failed = $true }
          }
          $dataQuality = Get-Content 'data-quality-report.json' -Raw | ConvertFrom-Json
          if ($dataQuality.status -eq 'fail' -or $dataQuality.failures.Count -gt 0) {
            Write-Host "::error::Data-quality gate FAILED — $($dataQuality.failures.Count) failure(s)"
            $failed = $true
          } elseif ($dataQuality.status -eq 'warn') {
            Write-Host "::warning::Data-quality gate passed with $($dataQuality.warnings.Count) warning(s)"
          }
          if ($failed) { exit 1 }
          Write-Host "QA passed: $($qa.summary.passed)/$($qa.summary.total_checks) checks"
          Write-Host "Data quality passed: $($dataQuality.active_product_count) active products"
