name: Scrape Products

on:
  schedule:
    # Weekly: Monday 3 AM UTC
    - cron: '0 3 * * 1'
  workflow_dispatch:
    inputs:
      retailer:
        description: 'Retailer to scrape (biedronka, rewe, or all)'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - biedronka
          - rewe
      max_products:
        description: 'Maximum products per retailer'
        required: false
        default: '500'
        type: string

permissions:
  contents: read

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      matrix:
        retailer: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.retailer != 'all' && fromJSON(format('["{0}"]', github.event.inputs.retailer)) || fromJSON('["biedronka","rewe"]') }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scraper
        env:
          RETAILER: ${{ matrix.retailer }}
          RAW_MAX_PRODUCTS: ${{ github.event.inputs.max_products || '500' }}
        run: |
          MAX_PRODUCTS=$(python scripts/validate_max_products.py "$RAW_MAX_PRODUCTS")
          command=(
            python -m pipeline.scrape
            --retailer "$RETAILER"
            --max-products "$MAX_PRODUCTS"
            --output-dir "scraped-data/$RETAILER"
          )
          printf 'Running:'
          printf ' %q' "${command[@]}"
          printf '\n'
          "${command[@]}"

      - name: Upload scraped CSV
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scraped-${{ matrix.retailer }}-${{ github.run_id }}
          path: scraped-data/${{ matrix.retailer }}/*.csv
          retention-days: 30
          if-no-files-found: warn
