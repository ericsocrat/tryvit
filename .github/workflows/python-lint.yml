# ═══════════════════════════════════════════════════════════════════════════════
# Python Lint — ruff for pipeline & scripts
# ═══════════════════════════════════════════════════════════════════════════════
# Runs ruff check on all Python files. Triggered on PRs and pushes that touch
# Python source or the ruff configuration.
# ═══════════════════════════════════════════════════════════════════════════════

name: Python Lint

on:
  push:
    branches: [main]
    paths:
      - "pipeline/**/*.py"
      - "scripts/**/*.py"
      - "*.py"
      - "ruff.toml"
  pull_request:
    branches: [main]
    paths:
      - "pipeline/**/*.py"
      - "scripts/**/*.py"
      - "*.py"
      - "ruff.toml"

permissions:
  contents: read

jobs:
  ruff:
    name: Ruff Lint
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff
        run: ruff check . --output-format=github
