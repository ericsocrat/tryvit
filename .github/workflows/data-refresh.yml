name: Scheduled Data Refresh

on:
  schedule:
    # Every Sunday at 03:00 UTC
    - cron: '0 3 * * 0'
  workflow_dispatch:
    inputs:
      country:
        description: 'Country to refresh (PL, DE, or ALL)'
        required: false
        default: 'ALL'
        type: choice
        options:
          - ALL
          - PL
          - DE
      category:
        description: 'Single category name (leave empty for all)'
        required: false
        default: ''
        type: string
      max_products:
        description: 'Max products per category'
        required: false
        default: '100'
        type: string
      dry_run:
        description: 'Dry run (generate SQL only, do not execute)'
        required: false
        default: true
        type: boolean
      stale_only:
        description: 'Only re-fetch stale products'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  refresh:
    name: Data Refresh (${{ inputs.country || 'ALL' }})
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.0

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6.0.0
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run data refresh
        env:
          PYTHONIOENCODING: utf-8
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          COUNTRY: ${{ inputs.country || 'ALL' }}
          CATEGORY: ${{ inputs.category || '' }}
          RAW_MAX_PRODUCTS: ${{ inputs.max_products || '100' }}
          REQUESTED_DRY_RUN: ${{ github.event_name == 'schedule' && 'true' || inputs.dry_run }}
          STALE_ONLY: ${{ inputs.stale_only || false }}
        run: |
          MAX_PRODUCTS=$(python scripts/validate_max_products.py "$RAW_MAX_PRODUCTS")

          if [ "$REQUESTED_DRY_RUN" != "true" ]; then
            echo "::error::Database writes are disabled for this scheduled refresh workflow"
            exit 1
          fi

          command=(
            python -m pipeline.orchestrate
            --country "$COUNTRY"
            --max-products "$MAX_PRODUCTS"
            --dry-run
          )

          if [ -n "$CATEGORY" ]; then
            command+=(--category "$CATEGORY")
          fi

          if [ "$STALE_ONLY" = "true" ]; then
            command+=(--stale-only)
          fi

          printf 'Running:'
          printf ' %q' "${command[@]}"
          printf '\n'
          "${command[@]}"

      - name: Upload execution report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: refresh-report-${{ github.run_id }}
          path: pipeline/reports/refresh_*.json
          retention-days: 30
          if-no-files-found: ignore
