name: Phase 5A.0d Visual Baselines

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
    branches:
      - main
      - codex/phase-5a0d-performance-visual-gates
    paths:
      - "frontend/**"
      - "supabase/config.toml"
      - "supabase/migrations/**"
      - ".github/workflows/phase5a0d-visual-baselines.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase5a0d-visual-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  policy-enablement:
    name: Verify immutable visual baselines
    if: ${{ github.event_name == 'pull_request' && ((github.event.pull_request.base.sha == '296742c9b941e0aad9cfb5b00dfa3738af9eba0e' && github.event.pull_request.head.ref == 'codex/phase-5a0d-renderer-attestation-policy') || (github.event.pull_request.base.sha == '3887b1dc8eda1a59ce25725bf04996749f98935e' && github.event.pull_request.head.ref == 'codex/phase-5a0d-renderer-attestation-shell-fix') || (github.event.pull_request.base.sha == '920d9d01fdff3ab88eb46c082114f5fca998834c' && github.event.pull_request.head.ref == 'codex/phase-5a0d-attestation-label-trigger') || (github.event.pull_request.base.sha == 'd071d00970a108a13ab91aa7e1e736ca2416e119' && github.event.pull_request.head.ref == 'codex/phase-5a0d-renderer-identity-diagnostics') || (github.event.pull_request.base.sha == 'd9257be564c5097ef473b153202fc8e92c5a70e1' && github.event.pull_request.head.ref == 'codex/phase-5a0d-attested-manifest-restore')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout the one-time policy-enablement head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prove the one-time policy-only scope
        shell: bash
        env:
          POLICY_HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          expected="$RUNNER_TEMP/phase5a0d-policy-expected.txt"
          actual="$RUNNER_TEMP/phase5a0d-policy-actual.txt"
          if [ "$POLICY_HEAD_REF" = "codex/phase-5a0d-renderer-attestation-policy" ]; then
            printf '%s\n' \
              '.github/scripts/phase5a0d-renderer-attestation.mjs' \
              '.github/scripts/phase5a0d-renderer-attestation.test.mjs' \
              '.github/workflows/phase5a0d-renderer-attestation.yml' \
              '.github/workflows/phase5a0d-visual-baselines.yml' \
              'docs/PHASE5A0D_PERFORMANCE_VISUAL_GATES.md' \
              > "$expected"
          elif [ "$POLICY_HEAD_REF" = "codex/phase-5a0d-renderer-attestation-shell-fix" ]; then
            printf '%s\n' \
              '.github/scripts/phase5a0d-renderer-attestation.test.mjs' \
              '.github/workflows/phase5a0d-visual-baselines.yml' \
              > "$expected"
          elif [ "$POLICY_HEAD_REF" = "codex/phase-5a0d-attestation-label-trigger" ]; then
            printf '%s\n' \
              '.github/scripts/phase5a0d-renderer-attestation.test.mjs' \
              '.github/workflows/phase5a0d-visual-baselines.yml' \
              > "$expected"
          elif [ "$POLICY_HEAD_REF" = "codex/phase-5a0d-renderer-identity-diagnostics" ]; then
            printf '%s\n' \
              '.github/scripts/phase5a0d-renderer-attestation.test.mjs' \
              '.github/workflows/phase5a0d-visual-baselines.yml' \
              'frontend/tests/phase5a0d-measurement.test.ts' \
              'frontend/tooling/phase5a0d-visual-baselines.ts' \
              > "$expected"
          elif [ "$POLICY_HEAD_REF" = "codex/phase-5a0d-attested-manifest-restore" ]; then
            printf '%s\n' \
              '.github/scripts/phase5a0d-renderer-attestation.test.mjs' \
              '.github/workflows/phase5a0d-visual-baselines.yml' \
              > "$expected"
          else
            echo "::error::Unrecognized one-time renderer-attestation policy branch."
            exit 1
          fi
          git diff --name-only \
            "${{ github.event.pull_request.base.sha }}" \
            "${{ github.event.pull_request.head.sha }}" -- | sort > "$actual"
          if ! cmp --silent "$expected" "$actual"; then
            echo "::error::The one-time renderer-attestation policy PR changed outside its exact approved scope."
            diff -u "$expected" "$actual" || true
            exit 1
          fi
          git diff --quiet \
            "${{ github.event.pull_request.base.sha }}" \
            "${{ github.event.pull_request.head.sha }}" -- \
            frontend/e2e/__screenshots__/phase5a0d-manifest.json \
            'frontend/e2e/__screenshots__/p5a0d-*.png' \
            'frontend/e2e/__screenshots__/**/p5a0d-*.png'
          node --test .github/scripts/phase5a0d-renderer-attestation.test.mjs

  verify:
    name: Verify immutable visual baselines
    if: ${{ github.event_name == 'pull_request' && !((github.event.pull_request.base.sha == '296742c9b941e0aad9cfb5b00dfa3738af9eba0e' && github.event.pull_request.head.ref == 'codex/phase-5a0d-renderer-attestation-policy') || (github.event.pull_request.base.sha == '3887b1dc8eda1a59ce25725bf04996749f98935e' && github.event.pull_request.head.ref == 'codex/phase-5a0d-renderer-attestation-shell-fix') || (github.event.pull_request.base.sha == '920d9d01fdff3ab88eb46c082114f5fca998834c' && github.event.pull_request.head.ref == 'codex/phase-5a0d-attestation-label-trigger') || (github.event.pull_request.base.sha == 'd071d00970a108a13ab91aa7e1e736ca2416e119' && github.event.pull_request.head.ref == 'codex/phase-5a0d-renderer-identity-diagnostics') || (github.event.pull_request.base.sha == 'd9257be564c5097ef473b153202fc8e92c5a70e1' && github.event.pull_request.head.ref == 'codex/phase-5a0d-attested-manifest-restore')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CI: "true"
      VISUAL_SAFETY_APP_ORIGIN: http://127.0.0.1:3000
      BASE_URL: http://127.0.0.1:3000
      NPM_CONFIG_IGNORE_SCRIPTS: "true"
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Detect committed visual manifest on the exact PR head
        id: baseline_state
        shell: bash
        env:
          ATTESTATION_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          ATTESTATION_LABEL_PRESENT: ${{ contains(github.event.pull_request.labels.*.name, 'phase5a0d-renderer-attestation-approved') }}
        run: |
          set -euo pipefail
          base_sha="${{ github.event.pull_request.base.sha }}"
          head_sha="${{ github.event.pull_request.head.sha }}"
          phase5a0c_base="f03a79c97f9edc495a62fa02e89c45938a42fc6e"
          reviewed_phase5a0d_head="2b097bbe9eb0b3501421f1250972c98ce24ce60b"
          assert_synchronized_bootstrap() {
            if [ "$base_sha" = "$phase5a0c_base" ]; then
              return 0
            fi
            if ! git merge-base --is-ancestor "$phase5a0c_base" "$base_sha" || \
               ! git merge-base --is-ancestor "$base_sha" "$head_sha" || \
               ! git merge-base --is-ancestor "$reviewed_phase5a0d_head" "$head_sha"; then
              echo "::error::Synchronized visual-bootstrap ancestry cannot be proven."
              exit 1
            fi
            unexpected_base_paths="$(git diff --name-only "$phase5a0c_base" "$base_sha" -- | grep -Ev '^frontend/package(-lock)?\.json$' || true)"
            if [ -n "$unexpected_base_paths" ]; then
              echo "::error::The synchronized PR base contains changes outside the two dependency manifests."
              exit 1
            fi
            if ! git diff --quiet "$reviewed_phase5a0d_head" "$head_sha" -- \
              ':(literal)frontend/e2e/__screenshots__/phase5a0d-manifest.json' \
              ':(glob)frontend/e2e/__screenshots__/p5a0d-*.png' \
              ':(glob)frontend/e2e/__screenshots__/**/p5a0d-*.png'; then
              echo "::error::Reviewed Phase 5A.0d visual baseline bytes changed after synchronization."
              exit 1
            fi
          }
          if ! git cat-file -e "$base_sha^{commit}" 2>/dev/null; then
            echo "::error::The exact PR base commit is unavailable; baseline bootstrap cannot be proven."
            exit 1
          fi
          base_manifest=false
          if git cat-file -e "${{ github.event.pull_request.base.sha }}:frontend/e2e/__screenshots__/phase5a0d-manifest.json" 2>/dev/null; then
            base_manifest=true
          fi
          if [ -e e2e/__screenshots__/phase5a0d-manifest.json ] || [ -L e2e/__screenshots__/phase5a0d-manifest.json ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            if [ "$base_manifest" = "true" ]; then
              if ! git diff --quiet \
                "${{ github.event.pull_request.base.sha }}" \
                "${{ github.event.pull_request.head.sha }}" -- \
                ':(literal)frontend/e2e/__screenshots__/phase5a0d-manifest.json' \
                ':(glob)frontend/e2e/__screenshots__/p5a0d-*.png' \
                ':(glob)frontend/e2e/__screenshots__/**/p5a0d-*.png'; then
                expected="$RUNNER_TEMP/phase5a0d-attestation-expected.txt"
                actual="$RUNNER_TEMP/phase5a0d-attestation-actual.txt"
                printf '%s\n' \
                  'docs/evidence/phase5a0d-renderer-runtime-attestation.json' \
                  'frontend/e2e/__screenshots__/phase5a0d-manifest.json' \
                  > "$expected"
                git diff --name-only \
                  "${{ github.event.pull_request.base.sha }}" \
                  "${{ github.event.pull_request.head.sha }}" -- | sort > "$actual"
                if [ "$ATTESTATION_HEAD_REF" != "codex/phase-5a0d-renderer-runtime-attestation" ] || \
                   [ "$ATTESTATION_LABEL_PRESENT" != "true" ] || \
                   ! cmp --silent "$expected" "$actual"; then
                  echo "::error::Committed Phase 5A.0d baselines are immutable relative to the exact PR base. Generate and review candidates in a separately authorized baseline-update process."
                  echo "::error::renderer-attestation-scope-invalid"
                  exit 1
                fi
                echo "provenance=renderer-attestation-review-required" >> "$GITHUB_OUTPUT"
              else
                echo "provenance=immutable-pr-base" >> "$GITHUB_OUTPUT"
              fi
            else
              assert_synchronized_bootstrap
              if [ "$base_sha" = "$phase5a0c_base" ]; then
                echo "provenance=initial-candidate-review-required" >> "$GITHUB_OUTPUT"
              else
                echo "provenance=synchronized-candidate-review-required" >> "$GITHUB_OUTPUT"
              fi
            fi
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            if [ "$base_manifest" = "true" ]; then
              echo "::error::The committed visual manifest exists on the PR base but was removed from the exact PR head. Bootstrap generation is forbidden."
              exit 1
            fi
            if [ "${{ github.event.pull_request.base.sha }}" != "f03a79c97f9edc495a62fa02e89c45938a42fc6e" ]; then
              echo "::error::Initial baseline bootstrap is authorized only from the verified Phase 5A.0c base."
              exit 1
            fi
            echo "Initial baseline verification is deferred until reviewed candidates are committed."
          fi

      # Once Phase 5A.0d is on the PR base, the exact base revision supplies
      # the verifier that judges the head. The one-time f03 bootstrap remains
      # explicitly review-required and non-authoritative until it is merged.
      - name: Select and seal the exact visual verifier
        id: verifier_policy
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          base_sha="${{ github.event.pull_request.base.sha }}"
          head_sha="${{ github.event.pull_request.head.sha }}"
          phase5a0c_base="f03a79c97f9edc495a62fa02e89c45938a42fc6e"
          reviewed_phase5a0d_head="2b097bbe9eb0b3501421f1250972c98ce24ce60b"
          # Phase 5A.0e was reviewed separately before this stack was collapsed.
          # Its product-detail a11y regression spec is not imported by either
          # visual-baseline command. Permit only this exact approved blob while
          # the Phase 5A.0d verifier is still absent from the PR base.
          approved_phase5a0e_authenticated_a11y_blob="d2cec5ed670a6d7b31372b1fd3499f544c2d77d1"
          # A separately reviewed production-audit fix may synchronize this exact
          # override from main. No other package metadata change is permitted.
          approved_security_nanoid_override="3.3.17"
          baseline_runtime_sha="$(node -e 'const manifest = require("./frontend/e2e/__screenshots__/phase5a0d-manifest.json"); if (typeof manifest.sourceCommit !== "string" || !/^[0-9a-f]{40}$/.test(manifest.sourceCommit)) process.exit(1); process.stdout.write(manifest.sourceCommit);')"
          # Squash-merging can leave the immutable manifest's reviewed runtime
          # reachable only by exact object ID after its source branch is removed.
          # Fetch that already-attested SHA without creating a mutable ref.
          if ! git cat-file -e "$baseline_runtime_sha^{commit}" 2>/dev/null; then
            git fetch --no-tags --no-write-fetch-head origin "$baseline_runtime_sha"
          fi
          if ! git cat-file -e "$baseline_runtime_sha^{commit}" 2>/dev/null; then
            echo "::error::The immutable visual manifest references an unavailable baseline runtime commit."
            exit 1
          fi
          source_sha="$base_sha"
          source="pr-base"
          trusted=true
          if ! git cat-file -e "$base_sha:frontend/tooling/phase5a0d-visual-baselines.ts" 2>/dev/null || \
             ! git cat-file -e "$base_sha:frontend/e2e/scripts/visual-safety-cli.mts" 2>/dev/null; then
            if [ "$base_sha" != "$phase5a0c_base" ]; then
              if ! git merge-base --is-ancestor "$phase5a0c_base" "$base_sha" || \
                 ! git merge-base --is-ancestor "$base_sha" "$head_sha" || \
                 ! git merge-base --is-ancestor "$reviewed_phase5a0d_head" "$head_sha"; then
                echo "::error::Synchronized visual-verifier ancestry cannot be proven."
                exit 1
              fi
              unexpected_base_paths="$(git diff --name-only "$phase5a0c_base" "$base_sha" -- | grep -Ev '^frontend/package(-lock)?\.json$' || true)"
              if [ -n "$unexpected_base_paths" ]; then
                echo "::error::The synchronized PR base contains changes outside the two dependency manifests."
                exit 1
              fi
              unexpected_visual_verifier_paths="$(git diff --name-only "$reviewed_phase5a0d_head" "$head_sha" -- \
                frontend/playwright.config.ts frontend/e2e frontend/tooling | \
                grep -Ev '^frontend/e2e/authenticated-a11y\.spec\.ts$' || true)"
              if [ -n "$unexpected_visual_verifier_paths" ]; then
                echo "::error::The reviewed Phase 5A.0d visual verifier changed after synchronization."
                exit 1
              fi
              if ! git cat-file -e "$head_sha:frontend/e2e/authenticated-a11y.spec.ts" 2>/dev/null || \
                 [ "$(git rev-parse "$head_sha:frontend/e2e/authenticated-a11y.spec.ts")" != "$approved_phase5a0e_authenticated_a11y_blob" ]; then
                echo "::error::The approved Phase 5A.0e authenticated accessibility spec changed after synchronization."
                exit 1
              fi
              git show "$reviewed_phase5a0d_head:frontend/package.json" > "$RUNNER_TEMP/phase5a0d-approved-visual-package.json"
              git show "$base_sha:frontend/package.json" > "$RUNNER_TEMP/phase5a0d-synchronized-visual-base-package.json"
              git show "$head_sha:frontend/package.json" > "$RUNNER_TEMP/phase5a0d-synchronized-visual-package.json"
              APPROVED_SECURITY_NANOID_OVERRIDE="$approved_security_nanoid_override" node -e 'const fs = require("fs"); const expectedNanoid = process.env.APPROVED_SECURITY_NANOID_OVERRIDE; const read = (name) => JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/" + name, "utf8")); const strip = (value, label) => { const copy = structuredClone(value); delete copy.dependencies; delete copy.devDependencies; if (copy.overrides?.nanoid !== undefined) { if (copy.overrides.nanoid !== expectedNanoid) throw new Error(label + " package contains an unapproved nanoid override"); delete copy.overrides.nanoid; if (Object.keys(copy.overrides).length === 0) delete copy.overrides; } return copy; }; const approved = read("phase5a0d-approved-visual-package.json"); const base = read("phase5a0d-synchronized-visual-base-package.json"); const synchronized = read("phase5a0d-synchronized-visual-package.json"); if (base.overrides?.nanoid !== expectedNanoid || synchronized.overrides?.nanoid !== expectedNanoid) throw new Error("synchronized visual package does not preserve the approved nanoid security override"); if (JSON.stringify(strip(approved, "reviewed")) !== JSON.stringify(strip(synchronized, "synchronized"))) throw new Error("synchronized visual package changed outside dependency versions or the approved nanoid security override");'
              if ! cmp --silent \
                <(git show "$base_sha:frontend/package-lock.json") \
                <(git show "$head_sha:frontend/package-lock.json"); then
                echo "::error::The synchronized visual head does not preserve the exact current-main lockfile."
                exit 1
              fi
            fi
            source_sha="$head_sha"
            source="synchronized-phase5a0d-bootstrap-review-required"
            trusted=false
          fi
          git archive --format=tar \
            --output="$RUNNER_TEMP/phase5a0d-reviewed-visual-verifier.tar" \
            "$source_sha" -- \
            frontend/playwright.config.ts \
            frontend/e2e \
            frontend/tooling
          git show "$source_sha:frontend/package.json" > "$RUNNER_TEMP/phase5a0d-reviewed-visual-package.json"
          git show "$baseline_runtime_sha:frontend/package.json" > "$RUNNER_TEMP/phase5a0d-baseline-runtime-package.json"
          git show "$baseline_runtime_sha:frontend/package-lock.json" > "$RUNNER_TEMP/phase5a0d-baseline-runtime-package-lock.json"
          {
            echo "archive_sha256=$(sha256sum "$RUNNER_TEMP/phase5a0d-reviewed-visual-verifier.tar" | awk '{print $1}')"
            echo "package_sha256=$(sha256sum "$RUNNER_TEMP/phase5a0d-reviewed-visual-package.json" | awk '{print $1}')"
            echo "runtime_package_sha256=$(sha256sum "$RUNNER_TEMP/phase5a0d-baseline-runtime-package.json" | awk '{print $1}')"
            echo "runtime_lock_sha256=$(sha256sum "$RUNNER_TEMP/phase5a0d-baseline-runtime-package-lock.json" | awk '{print $1}')"
            echo "runtime_sha=$baseline_runtime_sha"
            echo "source=$source"
            echo "source_sha=$source_sha"
            echo "trusted=$trusted"
          } >> "$GITHUB_OUTPUT"

      - name: Setup Node
        if: ${{ steps.baseline_state.outputs.exists == 'true' }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.21.1
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Pixel verification must use the exact dependency graph that created the
      # immutable manifest. Current-main dependencies are measured separately
      # by candidate generation, Lighthouse, and route-JS accounting.
      - name: Install the manifest-attested baseline runtime without manifest mutation
        if: ${{ steps.baseline_state.outputs.exists == 'true' }}
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          echo "${{ steps.verifier_policy.outputs.runtime_package_sha256 }}  $RUNNER_TEMP/phase5a0d-baseline-runtime-package.json" | sha256sum -c -
          echo "${{ steps.verifier_policy.outputs.runtime_lock_sha256 }}  $RUNNER_TEMP/phase5a0d-baseline-runtime-package-lock.json" | sha256sum -c -
          git show "${{ github.event.pull_request.head.sha }}:frontend/package.json" > "$RUNNER_TEMP/phase5a0d-current-package.json"
          git show "${{ github.event.pull_request.head.sha }}:frontend/package-lock.json" > "$RUNNER_TEMP/phase5a0d-current-package-lock.json"
          cp -- "$RUNNER_TEMP/phase5a0d-baseline-runtime-package.json" frontend/package.json
          cp -- "$RUNNER_TEMP/phase5a0d-baseline-runtime-package-lock.json" frontend/package-lock.json
          cd frontend
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium
          cd ..
          cp -- "$RUNNER_TEMP/phase5a0d-current-package.json" frontend/package.json
          cp -- "$RUNNER_TEMP/phase5a0d-current-package-lock.json" frontend/package-lock.json
          git diff --quiet HEAD -- frontend/package.json frontend/package-lock.json
          cd frontend
          node -e 'const manifest = require("./e2e/__screenshots__/phase5a0d-manifest.json"); const installed = require("@playwright/test/package.json").version; if (installed !== manifest.versions.playwright) throw new Error("manifest-attested Playwright package was not installed");'
        timeout-minutes: 10

      - name: Re-attest and restore the exact visual verifier
        if: ${{ steps.baseline_state.outputs.exists == 'true' }}
        working-directory: .
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          git diff --quiet HEAD --
          echo "${{ steps.verifier_policy.outputs.archive_sha256 }}  $RUNNER_TEMP/phase5a0d-reviewed-visual-verifier.tar" | sha256sum -c -
          echo "${{ steps.verifier_policy.outputs.package_sha256 }}  $RUNNER_TEMP/phase5a0d-reviewed-visual-package.json" | sha256sum -c -
          if [ "${{ steps.baseline_state.outputs.provenance }}" = "renderer-attestation-review-required" ]; then
            git show "${{ github.event.pull_request.head.sha }}:frontend/e2e/__screenshots__/phase5a0d-manifest.json" \
              > "$RUNNER_TEMP/phase5a0d-attested-head-manifest.json"
          fi
          rm -rf -- frontend/e2e frontend/tooling frontend/playwright.config.ts
          tar -xf "$RUNNER_TEMP/phase5a0d-reviewed-visual-verifier.tar"
          if [ "${{ steps.baseline_state.outputs.provenance }}" = "renderer-attestation-review-required" ]; then
            cp -- "$RUNNER_TEMP/phase5a0d-attested-head-manifest.json" \
              frontend/e2e/__screenshots__/phase5a0d-manifest.json
          fi
          cd frontend
          node <<'NODE'
          const fs = require("fs");
          const current = JSON.parse(fs.readFileSync("package.json", "utf8"));
          const reviewed = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/phase5a0d-reviewed-visual-package.json", "utf8"));
          const allowedNames = [
            "visual-safety:preflight",
            "visual-safety:assert",
            "visual-safety:fixtures-seed",
            "visual-safety:fixtures-teardown",
            "phase5:visual:verify:public",
            "phase5:visual:verify:authenticated",
          ];
          const scripts = {};
          for (const name of allowedNames) {
            if (typeof reviewed.scripts?.[name] !== "string") throw new Error(`missing visual verifier script: ${name}`);
            scripts[name] = reviewed.scripts[name];
          }
          current.scripts = scripts;
          fs.writeFileSync("package.json", JSON.stringify(current, null, 2) + "\n");
          NODE

      - name: Record visual verifier provenance
        if: ${{ steps.baseline_state.outputs.exists == 'true' }}
        shell: bash
        run: |
          {
            echo "### Phase 5A.0d visual verifier"
            echo "- Source: \`${{ steps.verifier_policy.outputs.source }}\`"
            echo "- Source commit: \`${{ steps.verifier_policy.outputs.source_sha }}\`"
            echo "- Base-authoritative: \`${{ steps.verifier_policy.outputs.trusted }}\`"
            echo "- Immutable baseline runtime: \`${{ steps.verifier_policy.outputs.runtime_sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.verifier_policy.outputs.trusted }}" != "true" ]; then
            echo "::notice::Initial bootstrap verification uses the exact-head verifier and still requires explicit human review; base-authoritative enforcement begins after merge."
          fi

      - name: Setup pinned Supabase CLI
        id: local_supabase_cli
        if: ${{ steps.baseline_state.outputs.exists == 'true' }}
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v1
        with:
          version: 2.111.0

      - name: Public visual-safety preflight
        if: ${{ steps.baseline_state.outputs.exists == 'true' }}
        run: npm run visual-safety:preflight
        env:
          VISUAL_SAFETY_MODE: public

      - name: Verify committed public baselines without mutation
        id: public_visual_verify
        if: ${{ steps.baseline_state.outputs.exists == 'true' }}
        run: npm run phase5:visual:verify:public

      - name: Assert public visual safety
        id: public_safety_assert
        if: ${{ always() && steps.baseline_state.outputs.exists == 'true' }}
        run: npm run visual-safety:assert
        env:
          VISUAL_SAFETY_MODE: public

      - name: Start ephemeral local Supabase
        id: local_supabase_start
        if: ${{ !cancelled() && steps.baseline_state.outputs.exists == 'true' && steps.local_supabase_cli.outcome == 'success' }}
        working-directory: .
        run: bash frontend/e2e/scripts/local-supabase-ci.sh start

      - name: Local-authenticated visual-safety preflight (blocking)
        id: auth_preflight
        if: ${{ !cancelled() && steps.local_supabase_start.outcome == 'success' }}
        run: npm run visual-safety:preflight
        env:
          VISUAL_SAFETY_MODE: local-authenticated

      - name: Seed guarded local QA fixtures
        id: local_fixture_seed
        if: ${{ !cancelled() && steps.auth_preflight.outcome == 'success' }}
        shell: bash
        run: |
          fixture_ids="$RUNNER_TEMP/tryvit-visual-verify-fixture-ids.env"
          npm run --silent visual-safety:fixtures-seed > "$fixture_ids"
          if ! grep -Eq '^QA_PRODUCT_ID=[0-9]+$' "$fixture_ids"; then
            rm -f -- "$fixture_ids"
            echo "::error::Guarded local fixture seeding did not return deterministic IDs"
            exit 1
          fi
          grep -E '^QA_[A-Z_]+=[A-Za-z0-9_-]+$' "$fixture_ids" >> "$GITHUB_ENV"
          rm -f -- "$fixture_ids"
          echo "seeded=true" >> "$GITHUB_OUTPUT"

      - name: Verify committed authenticated baselines without mutation
        id: auth_visual_verify
        if: ${{ !cancelled() && steps.local_fixture_seed.outputs.seeded == 'true' }}
        run: npm run phase5:visual:verify:authenticated

      - name: Assert local-authenticated visual safety
        id: auth_safety_assert
        if: ${{ always() && steps.auth_preflight.outcome == 'success' }}
        run: npm run visual-safety:assert
        env:
          VISUAL_SAFETY_MODE: local-authenticated

      - name: Teardown guarded local QA fixtures
        id: local_fixture_teardown
        if: ${{ always() && steps.local_fixture_seed.outputs.seeded == 'true' }}
        run: npm run --silent visual-safety:fixtures-teardown

      - name: Stop ephemeral local Supabase (no backup)
        id: local_supabase_stop
        if: ${{ always() && steps.local_supabase_cli.outcome == 'success' }}
        working-directory: .
        run: bash frontend/e2e/scripts/local-supabase-ci.sh stop

      - name: Upload compact visual diffs after safety and cleanup
        if: ${{ always() && steps.public_safety_assert.outcome == 'success' && steps.auth_safety_assert.outcome == 'success' && steps.local_fixture_teardown.outcome == 'success' && steps.local_supabase_stop.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: phase5a0d-visual-diffs
          path: |
            frontend/test-results/**/*-actual.png
            frontend/test-results/**/*-diff.png
          if-no-files-found: ignore
          retention-days: 7

  generate-candidates:
    name: Generate deterministic baseline candidates
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CI: "true"
      VISUAL_SAFETY_APP_ORIGIN: http://127.0.0.1:3000
      BASE_URL: http://127.0.0.1:3000
      NPM_CONFIG_IGNORE_SCRIPTS: "true"
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Detect whether candidate generation is authorized
        id: baseline_state
        shell: bash
        run: |
          generate=false
          if [ -e e2e/__screenshots__/phase5a0d-manifest.json ] || [ -L e2e/__screenshots__/phase5a0d-manifest.json ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            if [ "${{ github.event_name }}" = "pull_request" ]; then
              echo "Committed baselines exist; PR candidate generation is disabled."
            else
              generate=true
            fi
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            if [ "${{ github.event_name }}" = "pull_request" ]; then
              if ! git cat-file -e "${{ github.event.pull_request.base.sha }}^{commit}" 2>/dev/null; then
                echo "::error::The exact PR base commit is unavailable; baseline bootstrap cannot be proven."
                exit 1
              fi
              if git cat-file -e "${{ github.event.pull_request.base.sha }}:frontend/e2e/__screenshots__/phase5a0d-manifest.json" 2>/dev/null; then
                echo "::error::The committed visual manifest exists on the PR base but was removed from the exact PR head. Bootstrap generation is forbidden."
                exit 1
              fi
              if [ "${{ github.event.pull_request.base.sha }}" != "f03a79c97f9edc495a62fa02e89c45938a42fc6e" ]; then
                echo "::error::Initial candidate bootstrap is authorized only from the verified Phase 5A.0c base."
                exit 1
              fi
              echo "Initial baseline bootstrap will upload candidates for human review only."
            fi
            generate=true
          fi
          echo "generate=$generate" >> "$GITHUB_OUTPUT"

      - name: Seal the exact candidate generator before dependency lifecycle scripts
        id: candidate_harness
        if: ${{ steps.baseline_state.outputs.generate == 'true' }}
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse HEAD)"
          git archive --format=tar \
            --output="$RUNNER_TEMP/phase5a0d-candidate-generator.tar" \
            "$source_sha" -- \
            frontend/playwright.config.ts \
            frontend/e2e \
            frontend/tooling
          git show "$source_sha:frontend/package.json" > "$RUNNER_TEMP/phase5a0d-candidate-package.json"
          {
            echo "archive_sha256=$(sha256sum "$RUNNER_TEMP/phase5a0d-candidate-generator.tar" | awk '{print $1}')"
            echo "package_sha256=$(sha256sum "$RUNNER_TEMP/phase5a0d-candidate-package.json" | awk '{print $1}')"
            echo "source_sha=$source_sha"
          } >> "$GITHUB_OUTPUT"

      - name: Setup Node
        if: ${{ steps.baseline_state.outputs.generate == 'true' }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.21.1
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        if: ${{ steps.baseline_state.outputs.generate == 'true' }}
        run: npm ci --ignore-scripts

      # ubuntu-24.04, the exact Node patch, package lock, and the Playwright-
      # managed Chromium version together define the authoritative renderer.
      - name: Install lockfile-pinned Playwright Chromium
        if: ${{ steps.baseline_state.outputs.generate == 'true' }}
        run: npx playwright install --with-deps chromium
        timeout-minutes: 8

      - name: Reinstall dependencies from lockfile after browser setup
        if: ${{ steps.baseline_state.outputs.generate == 'true' }}
        run: npm ci --ignore-scripts --prefer-offline

      - name: Re-attest and restore the exact candidate generator
        if: ${{ steps.baseline_state.outputs.generate == 'true' }}
        working-directory: .
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "${{ steps.candidate_harness.outputs.source_sha }}"
          git diff --quiet HEAD --
          echo "${{ steps.candidate_harness.outputs.archive_sha256 }}  $RUNNER_TEMP/phase5a0d-candidate-generator.tar" | sha256sum -c -
          echo "${{ steps.candidate_harness.outputs.package_sha256 }}  $RUNNER_TEMP/phase5a0d-candidate-package.json" | sha256sum -c -
          rm -rf -- frontend/e2e frontend/tooling frontend/playwright.config.ts
          tar -xf "$RUNNER_TEMP/phase5a0d-candidate-generator.tar"
          cd frontend
          node <<'NODE'
          const fs = require("fs");
          const current = JSON.parse(fs.readFileSync("package.json", "utf8"));
          const reviewed = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/phase5a0d-candidate-package.json", "utf8"));
          const allowedNames = [
            "visual-safety:preflight",
            "visual-safety:assert",
            "visual-safety:fixtures-seed",
            "visual-safety:fixtures-teardown",
            "phase5:visual:generate:public",
            "phase5:visual:generate:authenticated",
            "phase5:visual:manifest:generate",
            "phase5:visual:artifact:stage",
          ];
          const scripts = {};
          for (const name of allowedNames) {
            if (typeof reviewed.scripts?.[name] !== "string") throw new Error(`missing candidate generator script: ${name}`);
            scripts[name] = reviewed.scripts[name];
          }
          current.scripts = scripts;
          fs.writeFileSync("package.json", JSON.stringify(current, null, 2) + "\n");
          NODE

      - name: Setup pinned Supabase CLI
        id: local_supabase_cli
        if: ${{ steps.baseline_state.outputs.generate == 'true' }}
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v1
        with:
          version: 2.111.0

      - name: First public visual-safety preflight
        if: ${{ steps.baseline_state.outputs.generate == 'true' }}
        run: npm run visual-safety:preflight
        env:
          VISUAL_SAFETY_MODE: public

      - name: Generate first public candidate pass
        id: first_public_generate
        if: ${{ steps.baseline_state.outputs.generate == 'true' }}
        run: npm run phase5:visual:generate:public

      - name: Assert first public pass safety
        id: first_public_safety_assert
        if: ${{ always() && steps.baseline_state.outputs.generate == 'true' }}
        run: npm run visual-safety:assert
        env:
          VISUAL_SAFETY_MODE: public

      - name: Start ephemeral local Supabase
        id: local_supabase_start
        if: ${{ !cancelled() && steps.baseline_state.outputs.generate == 'true' && steps.local_supabase_cli.outcome == 'success' }}
        working-directory: .
        run: bash frontend/e2e/scripts/local-supabase-ci.sh start

      - name: Local-authenticated visual-safety preflight (blocking)
        id: auth_preflight
        if: ${{ !cancelled() && steps.local_supabase_start.outcome == 'success' }}
        run: npm run visual-safety:preflight
        env:
          VISUAL_SAFETY_MODE: local-authenticated

      - name: Seed guarded first-pass fixtures
        id: first_fixture_seed
        if: ${{ !cancelled() && steps.auth_preflight.outcome == 'success' }}
        shell: bash
        run: |
          fixture_ids="$RUNNER_TEMP/tryvit-visual-first-fixture-ids.env"
          npm run --silent visual-safety:fixtures-seed > "$fixture_ids"
          if ! grep -Eq '^QA_PRODUCT_ID=[0-9]+$' "$fixture_ids"; then
            rm -f -- "$fixture_ids"
            echo "::error::Guarded first-pass fixture seeding did not return deterministic IDs"
            exit 1
          fi
          grep -E '^QA_[A-Z_]+=[A-Za-z0-9_-]+$' "$fixture_ids" >> "$GITHUB_ENV"
          rm -f -- "$fixture_ids"
          echo "seeded=true" >> "$GITHUB_OUTPUT"

      - name: Generate first authenticated candidate pass
        id: first_auth_generate
        if: ${{ !cancelled() && steps.first_fixture_seed.outputs.seeded == 'true' }}
        run: npm run phase5:visual:generate:authenticated

      - name: Assert first authenticated pass safety
        id: first_auth_safety_assert
        if: ${{ always() && steps.auth_preflight.outcome == 'success' }}
        run: npm run visual-safety:assert
        env:
          VISUAL_SAFETY_MODE: local-authenticated

      - name: Teardown guarded first-pass fixtures
        id: first_fixture_teardown
        if: ${{ always() && steps.first_fixture_seed.outputs.seeded == 'true' }}
        run: npm run --silent visual-safety:fixtures-teardown

      - name: Seal and hash first exact seven-image candidate set
        if: ${{ !cancelled() && steps.first_public_generate.outcome == 'success' && steps.first_auth_generate.outcome == 'success' && steps.first_public_safety_assert.outcome == 'success' && steps.first_auth_safety_assert.outcome == 'success' && steps.first_fixture_teardown.outcome == 'success' }}
        shell: bash
        run: |
          npm run phase5:visual:manifest:generate
          npm run --silent phase5:visual:artifact:stage -- "$RUNNER_TEMP/phase5a0d-first-candidates"
          (cd "$RUNNER_TEMP/phase5a0d-first-candidates" && find . -type f -print0 | sort -z | xargs -0 sha256sum) > "$RUNNER_TEMP/phase5a0d-first.sha256"
          test "$(find "$RUNNER_TEMP/phase5a0d-first-candidates" -type f | wc -l)" -eq 8
          cp "$RUNNER_TEMP/phase5a0d-first-candidates/phase5a0d-manifest.json" "$RUNNER_TEMP/phase5a0d-first-manifest.json"

      - name: Generate second public candidate pass
        id: second_public_generate
        if: ${{ !cancelled() && steps.baseline_state.outputs.generate == 'true' }}
        run: npm run phase5:visual:generate:public

      - name: Assert second public pass safety
        id: second_public_safety_assert
        if: ${{ always() && steps.baseline_state.outputs.generate == 'true' && steps.second_public_generate.outcome != 'skipped' }}
        run: npm run visual-safety:assert
        env:
          VISUAL_SAFETY_MODE: public

      - name: Seed guarded second-pass fixtures
        id: second_fixture_seed
        if: ${{ !cancelled() && steps.auth_preflight.outcome == 'success' }}
        shell: bash
        run: |
          fixture_ids="$RUNNER_TEMP/tryvit-visual-second-fixture-ids.env"
          npm run --silent visual-safety:fixtures-seed > "$fixture_ids"
          if ! grep -Eq '^QA_PRODUCT_ID=[0-9]+$' "$fixture_ids"; then
            rm -f -- "$fixture_ids"
            echo "::error::Guarded second-pass fixture seeding did not return deterministic IDs"
            exit 1
          fi
          grep -E '^QA_[A-Z_]+=[A-Za-z0-9_-]+$' "$fixture_ids" >> "$GITHUB_ENV"
          rm -f -- "$fixture_ids"
          echo "seeded=true" >> "$GITHUB_OUTPUT"

      - name: Generate second authenticated candidate pass
        id: second_auth_generate
        if: ${{ !cancelled() && steps.second_fixture_seed.outputs.seeded == 'true' }}
        run: npm run phase5:visual:generate:authenticated

      - name: Assert second authenticated pass safety
        id: second_auth_safety_assert
        if: ${{ always() && steps.auth_preflight.outcome == 'success' }}
        run: npm run visual-safety:assert
        env:
          VISUAL_SAFETY_MODE: local-authenticated

      - name: Teardown guarded second-pass fixtures
        id: second_fixture_teardown
        if: ${{ always() && steps.second_fixture_seed.outputs.seeded == 'true' }}
        run: npm run --silent visual-safety:fixtures-teardown

      - name: Seal second exact seven-image candidate set
        id: deterministic_candidates
        if: ${{ !cancelled() && steps.second_public_generate.outcome == 'success' && steps.second_auth_generate.outcome == 'success' && steps.second_public_safety_assert.outcome == 'success' && steps.second_auth_safety_assert.outcome == 'success' && steps.second_fixture_teardown.outcome == 'success' }}
        shell: bash
        run: |
          npm run phase5:visual:manifest:generate
          npm run --silent phase5:visual:artifact:stage -- "$RUNNER_TEMP/phase5a0d-second-candidates"
          (cd "$RUNNER_TEMP/phase5a0d-second-candidates" && find . -type f -print0 | sort -z | xargs -0 sha256sum) > "$RUNNER_TEMP/phase5a0d-second.sha256"
          test "$(find "$RUNNER_TEMP/phase5a0d-second-candidates" -type f | wc -l)" -eq 8
          cmp --silent "$RUNNER_TEMP/phase5a0d-first.sha256" "$RUNNER_TEMP/phase5a0d-second.sha256"
          cp "$RUNNER_TEMP/phase5a0d-second-candidates/phase5a0d-manifest.json" "$RUNNER_TEMP/phase5a0d-second-manifest.json"
          mkdir -p "$RUNNER_TEMP/phase5a0d-determinism-evidence"
          cp "$RUNNER_TEMP/phase5a0d-first-manifest.json" "$RUNNER_TEMP/phase5a0d-determinism-evidence/first-manifest.json"
          cp "$RUNNER_TEMP/phase5a0d-second-manifest.json" "$RUNNER_TEMP/phase5a0d-determinism-evidence/second-manifest.json"
          cp "$RUNNER_TEMP/phase5a0d-first.sha256" "$RUNNER_TEMP/phase5a0d-determinism-evidence/first-files.sha256"
          cp "$RUNNER_TEMP/phase5a0d-second.sha256" "$RUNNER_TEMP/phase5a0d-determinism-evidence/second-files.sha256"
          SOURCE_SHA="${{ steps.candidate_harness.outputs.source_sha }}" \
          GENERATOR_SHA="${{ steps.candidate_harness.outputs.archive_sha256 }}" \
          PACKAGE_SHA="${{ steps.candidate_harness.outputs.package_sha256 }}" \
          LOCKFILE_SHA="$(sha256sum package-lock.json | awk '{print $1}')" \
          node <<'NODE'
          const fs = require("node:fs");
          const manifest = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/phase5a0d-second-manifest.json", "utf8"));
          const evidence = {
            schemaVersion: 1,
            sourceCommit: process.env.SOURCE_SHA,
            runner: manifest.runner,
            versions: manifest.versions,
            generatorArchiveSha256: process.env.GENERATOR_SHA,
            packageJsonSha256: process.env.PACKAGE_SHA,
            packageLockSha256: process.env.LOCKFILE_SHA,
            byteIdentical: true,
          };
          fs.writeFileSync(
            process.env.RUNNER_TEMP + "/phase5a0d-determinism-evidence/provenance.json",
            JSON.stringify(evidence, null, 2) + "\n",
          );
          NODE
          echo "byte_identical=true" >> "$GITHUB_OUTPUT"

      - name: Stop ephemeral local Supabase (no backup)
        id: local_supabase_stop
        if: ${{ always() && steps.local_supabase_cli.outcome == 'success' }}
        working-directory: .
        run: bash frontend/e2e/scripts/local-supabase-ci.sh stop

      - name: Upload exact deterministic baseline candidates
        if: ${{ always() && steps.first_public_safety_assert.outcome == 'success' && steps.first_auth_safety_assert.outcome == 'success' && steps.first_fixture_teardown.outcome == 'success' && steps.second_public_safety_assert.outcome == 'success' && steps.second_auth_safety_assert.outcome == 'success' && steps.second_fixture_teardown.outcome == 'success' && steps.deterministic_candidates.outputs.byte_identical == 'true' && steps.local_supabase_stop.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: phase5a0d-visual-baseline-candidates-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/phase5a0d-second-candidates/
          if-no-files-found: error
          retention-days: 7

      - name: Upload compact two-pass determinism evidence
        if: ${{ always() && steps.first_public_safety_assert.outcome == 'success' && steps.first_auth_safety_assert.outcome == 'success' && steps.first_fixture_teardown.outcome == 'success' && steps.second_public_safety_assert.outcome == 'success' && steps.second_auth_safety_assert.outcome == 'success' && steps.second_fixture_teardown.outcome == 'success' && steps.deterministic_candidates.outputs.byte_identical == 'true' && steps.local_supabase_stop.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: phase5a0d-visual-determinism-evidence-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/phase5a0d-determinism-evidence/
          if-no-files-found: error
          retention-days: 14
