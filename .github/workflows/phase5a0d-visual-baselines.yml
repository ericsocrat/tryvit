name: Phase 5A.0d Visual Baselines

on:
  pull_request:
    branches: [main]
    paths:
      - "frontend/**"
      - "supabase/config.toml"
      - "supabase/migrations/**"
      - ".github/workflows/phase5a0d-visual-baselines.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase5a0d-visual-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify immutable visual baselines
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CI: "true"
      VISUAL_SAFETY_APP_ORIGIN: http://127.0.0.1:3000
      BASE_URL: http://127.0.0.1:3000
      NPM_CONFIG_IGNORE_SCRIPTS: "true"
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Detect committed visual manifest on the exact PR head
        id: baseline_state
        shell: bash
        run: |
          set -euo pipefail
          base_sha="${{ github.event.pull_request.base.sha }}"
          head_sha="${{ github.event.pull_request.head.sha }}"
          phase5a0c_base="f03a79c97f9edc495a62fa02e89c45938a42fc6e"
          reviewed_phase5a0d_head="2b097bbe9eb0b3501421f1250972c98ce24ce60b"
          assert_synchronized_bootstrap() {
            if [ "$base_sha" = "$phase5a0c_base" ]; then
              return 0
            fi
            if ! git merge-base --is-ancestor "$phase5a0c_base" "$base_sha" || \
               ! git merge-base --is-ancestor "$base_sha" "$head_sha" || \
               ! git merge-base --is-ancestor "$reviewed_phase5a0d_head" "$head_sha"; then
              echo "::error::Synchronized visual-bootstrap ancestry cannot be proven."
              exit 1
            fi
            unexpected_base_paths="$(git diff --name-only "$phase5a0c_base" "$base_sha" -- | grep -Ev '^frontend/package(-lock)?\.json$' || true)"
            if [ -n "$unexpected_base_paths" ]; then
              echo "::error::The synchronized PR base contains changes outside the two dependency manifests."
              exit 1
            fi
            if ! git diff --quiet "$reviewed_phase5a0d_head" "$head_sha" -- \
              ':(literal)frontend/e2e/__screenshots__/phase5a0d-manifest.json' \
              ':(glob)frontend/e2e/__screenshots__/p5a0d-*.png' \
              ':(glob)frontend/e2e/__screenshots__/**/p5a0d-*.png'; then
              echo "::error::Reviewed Phase 5A.0d visual baseline bytes changed after synchronization."
              exit 1
            fi
          }
          if ! git cat-file -e "$base_sha^{commit}" 2>/dev/null; then
            echo "::error::The exact PR base commit is unavailable; baseline bootstrap cannot be proven."
            exit 1
          fi
          base_manifest=false
          if git cat-file -e "${{ github.event.pull_request.base.sha }}:frontend/e2e/__screenshots__/phase5a0d-manifest.json" 2>/dev/null; then
            base_manifest=true
          fi
          if [ -e e2e/__screenshots__/phase5a0d-manifest.json ] || [ -L e2e/__screenshots__/phase5a0d-manifest.json ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            if [ "$base_manifest" = "true" ]; then
              if ! git diff --quiet \
                "${{ github.event.pull_request.base.sha }}" \
                "${{ github.event.pull_request.head.sha }}" -- \
                ':(literal)frontend/e2e/__screenshots__/phase5a0d-manifest.json' \
                ':(glob)frontend/e2e/__screenshots__/p5a0d-*.png' \
                ':(glob)frontend/e2e/__screenshots__/**/p5a0d-*.png'; then
                echo "::error::Committed Phase 5A.0d baselines are immutable relative to the exact PR base. Generate and review candidates in a separately authorized baseline-update process."
                exit 1
              fi
              echo "provenance=immutable-pr-base" >> "$GITHUB_OUTPUT"
            else
              assert_synchronized_bootstrap
              if [ "$base_sha" = "$phase5a0c_base" ]; then
                echo "provenance=initial-candidate-review-required" >> "$GITHUB_OUTPUT"
              else
                echo "provenance=synchronized-candidate-review-required" >> "$GITHUB_OUTPUT"
              fi
            fi
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            if [ "$base_manifest" = "true" ]; then
              echo "::error::The committed visual manifest exists on the PR base but was removed from the exact PR head. Bootstrap generation is forbidden."
              exit 1
            fi
            if [ "${{ github.event.pull_request.base.sha }}" != "f03a79c97f9edc495a62fa02e89c45938a42fc6e" ]; then
              echo "::error::Initial baseline bootstrap is authorized only from the verified Phase 5A.0c base."
              exit 1
            fi
            echo "Initial baseline verification is deferred until reviewed candidates are committed."
          fi

      # Once Phase 5A.0d is on the PR base, the exact base revision supplies
      # the verifier that judges the head. The one-time f03 bootstrap remains
      # explicitly review-required and non-authoritative until it is merged.
      - name: Select and seal the exact visual verifier
        id: verifier_policy
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          base_sha="${{ github.event.pull_request.base.sha }}"
          head_sha="${{ github.event.pull_request.head.sha }}"
          phase5a0c_base="f03a79c97f9edc495a62fa02e89c45938a42fc6e"
          reviewed_phase5a0d_head="2b097bbe9eb0b3501421f1250972c98ce24ce60b"
          source_sha="$base_sha"
          source="pr-base"
          trusted=true
          if ! git cat-file -e "$base_sha:frontend/tooling/phase5a0d-visual-baselines.ts" 2>/dev/null || \
             ! git cat-file -e "$base_sha:frontend/e2e/scripts/visual-safety-cli.mts" 2>/dev/null; then
            if [ "$base_sha" != "$phase5a0c_base" ]; then
              if ! git merge-base --is-ancestor "$phase5a0c_base" "$base_sha" || \
                 ! git merge-base --is-ancestor "$base_sha" "$head_sha" || \
                 ! git merge-base --is-ancestor "$reviewed_phase5a0d_head" "$head_sha"; then
                echo "::error::Synchronized visual-verifier ancestry cannot be proven."
                exit 1
              fi
              unexpected_base_paths="$(git diff --name-only "$phase5a0c_base" "$base_sha" -- | grep -Ev '^frontend/package(-lock)?\.json$' || true)"
              if [ -n "$unexpected_base_paths" ]; then
                echo "::error::The synchronized PR base contains changes outside the two dependency manifests."
                exit 1
              fi
              if ! git diff --quiet "$reviewed_phase5a0d_head" "$head_sha" -- \
                frontend/playwright.config.ts frontend/e2e frontend/tooling; then
                echo "::error::The reviewed Phase 5A.0d visual verifier changed after synchronization."
                exit 1
              fi
              git show "$reviewed_phase5a0d_head:frontend/package.json" > "$RUNNER_TEMP/phase5a0d-approved-visual-package.json"
              git show "$head_sha:frontend/package.json" > "$RUNNER_TEMP/phase5a0d-synchronized-visual-package.json"
              node -e 'const fs = require("fs"); const strip = (value) => { const copy = structuredClone(value); delete copy.dependencies; delete copy.devDependencies; return copy; }; const approved = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/phase5a0d-approved-visual-package.json", "utf8")); const synchronized = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/phase5a0d-synchronized-visual-package.json", "utf8")); if (JSON.stringify(strip(approved)) !== JSON.stringify(strip(synchronized))) throw new Error("synchronized visual package changed outside dependency versions");'
              if ! cmp --silent \
                <(git show "$base_sha:frontend/package-lock.json") \
                <(git show "$head_sha:frontend/package-lock.json"); then
                echo "::error::The synchronized visual head does not preserve the exact current-main lockfile."
                exit 1
              fi
            fi
            source_sha="$head_sha"
            source="synchronized-phase5a0d-bootstrap-review-required"
            trusted=false
          fi
          git archive --format=tar \
            --output="$RUNNER_TEMP/phase5a0d-reviewed-visual-verifier.tar" \
            "$source_sha" -- \
            frontend/playwright.config.ts \
            frontend/e2e \
            frontend/tooling
          git show "$source_sha:frontend/package.json" > "$RUNNER_TEMP/phase5a0d-reviewed-visual-package.json"
          {
            echo "archive_sha256=$(sha256sum "$RUNNER_TEMP/phase5a0d-reviewed-visual-verifier.tar" | awk '{print $1}')"
            echo "package_sha256=$(sha256sum "$RUNNER_TEMP/phase5a0d-reviewed-visual-package.json" | awk '{print $1}')"
            echo "source=$source"
            echo "source_sha=$source_sha"
            echo "trusted=$trusted"
          } >> "$GITHUB_OUTPUT"

      - name: Setup Node
        if: ${{ steps.baseline_state.outputs.exists == 'true' }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.21.1
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        if: ${{ steps.baseline_state.outputs.exists == 'true' }}
        run: npm ci --ignore-scripts

      - name: Install lockfile-pinned Playwright Chromium
        if: ${{ steps.baseline_state.outputs.exists == 'true' }}
        run: npx playwright install --with-deps chromium
        timeout-minutes: 8

      - name: Reinstall dependencies from lockfile after browser setup
        if: ${{ steps.baseline_state.outputs.exists == 'true' }}
        run: npm ci --ignore-scripts --prefer-offline

      - name: Re-attest and restore the exact visual verifier
        if: ${{ steps.baseline_state.outputs.exists == 'true' }}
        working-directory: .
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          git diff --quiet HEAD --
          echo "${{ steps.verifier_policy.outputs.archive_sha256 }}  $RUNNER_TEMP/phase5a0d-reviewed-visual-verifier.tar" | sha256sum -c -
          echo "${{ steps.verifier_policy.outputs.package_sha256 }}  $RUNNER_TEMP/phase5a0d-reviewed-visual-package.json" | sha256sum -c -
          rm -rf -- frontend/e2e frontend/tooling frontend/playwright.config.ts
          tar -xf "$RUNNER_TEMP/phase5a0d-reviewed-visual-verifier.tar"
          cd frontend
          node <<'NODE'
          const fs = require("fs");
          const current = JSON.parse(fs.readFileSync("package.json", "utf8"));
          const reviewed = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/phase5a0d-reviewed-visual-package.json", "utf8"));
          const allowedNames = [
            "visual-safety:preflight",
            "visual-safety:assert",
            "visual-safety:fixtures-seed",
            "visual-safety:fixtures-teardown",
            "phase5:visual:verify:public",
            "phase5:visual:verify:authenticated",
          ];
          const scripts = {};
          for (const name of allowedNames) {
            if (typeof reviewed.scripts?.[name] !== "string") throw new Error(`missing visual verifier script: ${name}`);
            scripts[name] = reviewed.scripts[name];
          }
          current.scripts = scripts;
          fs.writeFileSync("package.json", JSON.stringify(current, null, 2) + "\n");
          NODE

      - name: Record visual verifier provenance
        if: ${{ steps.baseline_state.outputs.exists == 'true' }}
        shell: bash
        run: |
          {
            echo "### Phase 5A.0d visual verifier"
            echo "- Source: \`${{ steps.verifier_policy.outputs.source }}\`"
            echo "- Source commit: \`${{ steps.verifier_policy.outputs.source_sha }}\`"
            echo "- Base-authoritative: \`${{ steps.verifier_policy.outputs.trusted }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.verifier_policy.outputs.trusted }}" != "true" ]; then
            echo "::notice::Initial bootstrap verification uses the exact-head verifier and still requires explicit human review; base-authoritative enforcement begins after merge."
          fi

      - name: Setup pinned Supabase CLI
        id: local_supabase_cli
        if: ${{ steps.baseline_state.outputs.exists == 'true' }}
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v1
        with:
          version: 2.111.0

      - name: Public visual-safety preflight
        if: ${{ steps.baseline_state.outputs.exists == 'true' }}
        run: npm run visual-safety:preflight
        env:
          VISUAL_SAFETY_MODE: public

      - name: Verify committed public baselines without mutation
        id: public_visual_verify
        if: ${{ steps.baseline_state.outputs.exists == 'true' }}
        run: npm run phase5:visual:verify:public

      - name: Assert public visual safety
        id: public_safety_assert
        if: ${{ always() && steps.baseline_state.outputs.exists == 'true' }}
        run: npm run visual-safety:assert
        env:
          VISUAL_SAFETY_MODE: public

      - name: Start ephemeral local Supabase
        id: local_supabase_start
        if: ${{ !cancelled() && steps.baseline_state.outputs.exists == 'true' && steps.local_supabase_cli.outcome == 'success' }}
        working-directory: .
        run: bash frontend/e2e/scripts/local-supabase-ci.sh start

      - name: Local-authenticated visual-safety preflight (blocking)
        id: auth_preflight
        if: ${{ !cancelled() && steps.local_supabase_start.outcome == 'success' }}
        run: npm run visual-safety:preflight
        env:
          VISUAL_SAFETY_MODE: local-authenticated

      - name: Seed guarded local QA fixtures
        id: local_fixture_seed
        if: ${{ !cancelled() && steps.auth_preflight.outcome == 'success' }}
        shell: bash
        run: |
          fixture_ids="$RUNNER_TEMP/tryvit-visual-verify-fixture-ids.env"
          npm run --silent visual-safety:fixtures-seed > "$fixture_ids"
          if ! grep -Eq '^QA_PRODUCT_ID=[0-9]+$' "$fixture_ids"; then
            rm -f -- "$fixture_ids"
            echo "::error::Guarded local fixture seeding did not return deterministic IDs"
            exit 1
          fi
          grep -E '^QA_[A-Z_]+=[A-Za-z0-9_-]+$' "$fixture_ids" >> "$GITHUB_ENV"
          rm -f -- "$fixture_ids"
          echo "seeded=true" >> "$GITHUB_OUTPUT"

      - name: Verify committed authenticated baselines without mutation
        id: auth_visual_verify
        if: ${{ !cancelled() && steps.local_fixture_seed.outputs.seeded == 'true' }}
        run: npm run phase5:visual:verify:authenticated

      - name: Assert local-authenticated visual safety
        id: auth_safety_assert
        if: ${{ always() && steps.auth_preflight.outcome == 'success' }}
        run: npm run visual-safety:assert
        env:
          VISUAL_SAFETY_MODE: local-authenticated

      - name: Teardown guarded local QA fixtures
        id: local_fixture_teardown
        if: ${{ always() && steps.local_fixture_seed.outputs.seeded == 'true' }}
        run: npm run --silent visual-safety:fixtures-teardown

      - name: Stop ephemeral local Supabase (no backup)
        id: local_supabase_stop
        if: ${{ always() && steps.local_supabase_cli.outcome == 'success' }}
        working-directory: .
        run: bash frontend/e2e/scripts/local-supabase-ci.sh stop

      - name: Upload compact visual diffs after safety and cleanup
        if: ${{ always() && steps.public_safety_assert.outcome == 'success' && steps.auth_safety_assert.outcome == 'success' && steps.local_fixture_teardown.outcome == 'success' && steps.local_supabase_stop.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: phase5a0d-visual-diffs
          path: |
            frontend/test-results/**/*-actual.png
            frontend/test-results/**/*-diff.png
          if-no-files-found: ignore
          retention-days: 7

  generate-candidates:
    name: Generate deterministic baseline candidates
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CI: "true"
      VISUAL_SAFETY_APP_ORIGIN: http://127.0.0.1:3000
      BASE_URL: http://127.0.0.1:3000
      NPM_CONFIG_IGNORE_SCRIPTS: "true"
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Detect whether candidate generation is authorized
        id: baseline_state
        shell: bash
        run: |
          generate=false
          if [ -e e2e/__screenshots__/phase5a0d-manifest.json ] || [ -L e2e/__screenshots__/phase5a0d-manifest.json ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            if [ "${{ github.event_name }}" = "pull_request" ]; then
              echo "Committed baselines exist; PR candidate generation is disabled."
            else
              generate=true
            fi
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            if [ "${{ github.event_name }}" = "pull_request" ]; then
              if ! git cat-file -e "${{ github.event.pull_request.base.sha }}^{commit}" 2>/dev/null; then
                echo "::error::The exact PR base commit is unavailable; baseline bootstrap cannot be proven."
                exit 1
              fi
              if git cat-file -e "${{ github.event.pull_request.base.sha }}:frontend/e2e/__screenshots__/phase5a0d-manifest.json" 2>/dev/null; then
                echo "::error::The committed visual manifest exists on the PR base but was removed from the exact PR head. Bootstrap generation is forbidden."
                exit 1
              fi
              if [ "${{ github.event.pull_request.base.sha }}" != "f03a79c97f9edc495a62fa02e89c45938a42fc6e" ]; then
                echo "::error::Initial candidate bootstrap is authorized only from the verified Phase 5A.0c base."
                exit 1
              fi
              echo "Initial baseline bootstrap will upload candidates for human review only."
            fi
            generate=true
          fi
          echo "generate=$generate" >> "$GITHUB_OUTPUT"

      - name: Seal the exact candidate generator before dependency lifecycle scripts
        id: candidate_harness
        if: ${{ steps.baseline_state.outputs.generate == 'true' }}
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse HEAD)"
          git archive --format=tar \
            --output="$RUNNER_TEMP/phase5a0d-candidate-generator.tar" \
            "$source_sha" -- \
            frontend/playwright.config.ts \
            frontend/e2e \
            frontend/tooling
          git show "$source_sha:frontend/package.json" > "$RUNNER_TEMP/phase5a0d-candidate-package.json"
          {
            echo "archive_sha256=$(sha256sum "$RUNNER_TEMP/phase5a0d-candidate-generator.tar" | awk '{print $1}')"
            echo "package_sha256=$(sha256sum "$RUNNER_TEMP/phase5a0d-candidate-package.json" | awk '{print $1}')"
            echo "source_sha=$source_sha"
          } >> "$GITHUB_OUTPUT"

      - name: Setup Node
        if: ${{ steps.baseline_state.outputs.generate == 'true' }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.21.1
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        if: ${{ steps.baseline_state.outputs.generate == 'true' }}
        run: npm ci --ignore-scripts

      # ubuntu-24.04, the exact Node patch, package lock, and the Playwright-
      # managed Chromium version together define the authoritative renderer.
      - name: Install lockfile-pinned Playwright Chromium
        if: ${{ steps.baseline_state.outputs.generate == 'true' }}
        run: npx playwright install --with-deps chromium
        timeout-minutes: 8

      - name: Reinstall dependencies from lockfile after browser setup
        if: ${{ steps.baseline_state.outputs.generate == 'true' }}
        run: npm ci --ignore-scripts --prefer-offline

      - name: Re-attest and restore the exact candidate generator
        if: ${{ steps.baseline_state.outputs.generate == 'true' }}
        working-directory: .
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "${{ steps.candidate_harness.outputs.source_sha }}"
          git diff --quiet HEAD --
          echo "${{ steps.candidate_harness.outputs.archive_sha256 }}  $RUNNER_TEMP/phase5a0d-candidate-generator.tar" | sha256sum -c -
          echo "${{ steps.candidate_harness.outputs.package_sha256 }}  $RUNNER_TEMP/phase5a0d-candidate-package.json" | sha256sum -c -
          rm -rf -- frontend/e2e frontend/tooling frontend/playwright.config.ts
          tar -xf "$RUNNER_TEMP/phase5a0d-candidate-generator.tar"
          cd frontend
          node <<'NODE'
          const fs = require("fs");
          const current = JSON.parse(fs.readFileSync("package.json", "utf8"));
          const reviewed = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/phase5a0d-candidate-package.json", "utf8"));
          const allowedNames = [
            "visual-safety:preflight",
            "visual-safety:assert",
            "visual-safety:fixtures-seed",
            "visual-safety:fixtures-teardown",
            "phase5:visual:generate:public",
            "phase5:visual:generate:authenticated",
            "phase5:visual:manifest:generate",
            "phase5:visual:artifact:stage",
          ];
          const scripts = {};
          for (const name of allowedNames) {
            if (typeof reviewed.scripts?.[name] !== "string") throw new Error(`missing candidate generator script: ${name}`);
            scripts[name] = reviewed.scripts[name];
          }
          current.scripts = scripts;
          fs.writeFileSync("package.json", JSON.stringify(current, null, 2) + "\n");
          NODE

      - name: Setup pinned Supabase CLI
        id: local_supabase_cli
        if: ${{ steps.baseline_state.outputs.generate == 'true' }}
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v1
        with:
          version: 2.111.0

      - name: First public visual-safety preflight
        if: ${{ steps.baseline_state.outputs.generate == 'true' }}
        run: npm run visual-safety:preflight
        env:
          VISUAL_SAFETY_MODE: public

      - name: Generate first public candidate pass
        id: first_public_generate
        if: ${{ steps.baseline_state.outputs.generate == 'true' }}
        run: npm run phase5:visual:generate:public

      - name: Assert first public pass safety
        id: first_public_safety_assert
        if: ${{ always() && steps.baseline_state.outputs.generate == 'true' }}
        run: npm run visual-safety:assert
        env:
          VISUAL_SAFETY_MODE: public

      - name: Start ephemeral local Supabase
        id: local_supabase_start
        if: ${{ !cancelled() && steps.baseline_state.outputs.generate == 'true' && steps.local_supabase_cli.outcome == 'success' }}
        working-directory: .
        run: bash frontend/e2e/scripts/local-supabase-ci.sh start

      - name: Local-authenticated visual-safety preflight (blocking)
        id: auth_preflight
        if: ${{ !cancelled() && steps.local_supabase_start.outcome == 'success' }}
        run: npm run visual-safety:preflight
        env:
          VISUAL_SAFETY_MODE: local-authenticated

      - name: Seed guarded first-pass fixtures
        id: first_fixture_seed
        if: ${{ !cancelled() && steps.auth_preflight.outcome == 'success' }}
        shell: bash
        run: |
          fixture_ids="$RUNNER_TEMP/tryvit-visual-first-fixture-ids.env"
          npm run --silent visual-safety:fixtures-seed > "$fixture_ids"
          if ! grep -Eq '^QA_PRODUCT_ID=[0-9]+$' "$fixture_ids"; then
            rm -f -- "$fixture_ids"
            echo "::error::Guarded first-pass fixture seeding did not return deterministic IDs"
            exit 1
          fi
          grep -E '^QA_[A-Z_]+=[A-Za-z0-9_-]+$' "$fixture_ids" >> "$GITHUB_ENV"
          rm -f -- "$fixture_ids"
          echo "seeded=true" >> "$GITHUB_OUTPUT"

      - name: Generate first authenticated candidate pass
        id: first_auth_generate
        if: ${{ !cancelled() && steps.first_fixture_seed.outputs.seeded == 'true' }}
        run: npm run phase5:visual:generate:authenticated

      - name: Assert first authenticated pass safety
        id: first_auth_safety_assert
        if: ${{ always() && steps.auth_preflight.outcome == 'success' }}
        run: npm run visual-safety:assert
        env:
          VISUAL_SAFETY_MODE: local-authenticated

      - name: Teardown guarded first-pass fixtures
        id: first_fixture_teardown
        if: ${{ always() && steps.first_fixture_seed.outputs.seeded == 'true' }}
        run: npm run --silent visual-safety:fixtures-teardown

      - name: Seal and hash first exact seven-image candidate set
        if: ${{ !cancelled() && steps.first_public_generate.outcome == 'success' && steps.first_auth_generate.outcome == 'success' && steps.first_public_safety_assert.outcome == 'success' && steps.first_auth_safety_assert.outcome == 'success' && steps.first_fixture_teardown.outcome == 'success' }}
        shell: bash
        run: |
          npm run phase5:visual:manifest:generate
          npm run --silent phase5:visual:artifact:stage -- "$RUNNER_TEMP/phase5a0d-first-candidates"
          (cd "$RUNNER_TEMP/phase5a0d-first-candidates" && find . -type f -print0 | sort -z | xargs -0 sha256sum) > "$RUNNER_TEMP/phase5a0d-first.sha256"
          test "$(find "$RUNNER_TEMP/phase5a0d-first-candidates" -type f | wc -l)" -eq 8

      - name: Generate second public candidate pass
        id: second_public_generate
        if: ${{ !cancelled() && steps.baseline_state.outputs.generate == 'true' }}
        run: npm run phase5:visual:generate:public

      - name: Assert second public pass safety
        id: second_public_safety_assert
        if: ${{ always() && steps.baseline_state.outputs.generate == 'true' && steps.second_public_generate.outcome != 'skipped' }}
        run: npm run visual-safety:assert
        env:
          VISUAL_SAFETY_MODE: public

      - name: Seed guarded second-pass fixtures
        id: second_fixture_seed
        if: ${{ !cancelled() && steps.auth_preflight.outcome == 'success' }}
        shell: bash
        run: |
          fixture_ids="$RUNNER_TEMP/tryvit-visual-second-fixture-ids.env"
          npm run --silent visual-safety:fixtures-seed > "$fixture_ids"
          if ! grep -Eq '^QA_PRODUCT_ID=[0-9]+$' "$fixture_ids"; then
            rm -f -- "$fixture_ids"
            echo "::error::Guarded second-pass fixture seeding did not return deterministic IDs"
            exit 1
          fi
          grep -E '^QA_[A-Z_]+=[A-Za-z0-9_-]+$' "$fixture_ids" >> "$GITHUB_ENV"
          rm -f -- "$fixture_ids"
          echo "seeded=true" >> "$GITHUB_OUTPUT"

      - name: Generate second authenticated candidate pass
        id: second_auth_generate
        if: ${{ !cancelled() && steps.second_fixture_seed.outputs.seeded == 'true' }}
        run: npm run phase5:visual:generate:authenticated

      - name: Assert second authenticated pass safety
        id: second_auth_safety_assert
        if: ${{ always() && steps.auth_preflight.outcome == 'success' }}
        run: npm run visual-safety:assert
        env:
          VISUAL_SAFETY_MODE: local-authenticated

      - name: Teardown guarded second-pass fixtures
        id: second_fixture_teardown
        if: ${{ always() && steps.second_fixture_seed.outputs.seeded == 'true' }}
        run: npm run --silent visual-safety:fixtures-teardown

      - name: Seal second exact seven-image candidate set
        id: deterministic_candidates
        if: ${{ !cancelled() && steps.second_public_generate.outcome == 'success' && steps.second_auth_generate.outcome == 'success' && steps.second_public_safety_assert.outcome == 'success' && steps.second_auth_safety_assert.outcome == 'success' && steps.second_fixture_teardown.outcome == 'success' }}
        shell: bash
        run: |
          npm run phase5:visual:manifest:generate
          npm run --silent phase5:visual:artifact:stage -- "$RUNNER_TEMP/phase5a0d-second-candidates"
          (cd "$RUNNER_TEMP/phase5a0d-second-candidates" && find . -type f -print0 | sort -z | xargs -0 sha256sum) > "$RUNNER_TEMP/phase5a0d-second.sha256"
          test "$(find "$RUNNER_TEMP/phase5a0d-second-candidates" -type f | wc -l)" -eq 8
          cmp --silent "$RUNNER_TEMP/phase5a0d-first.sha256" "$RUNNER_TEMP/phase5a0d-second.sha256"
          echo "byte_identical=true" >> "$GITHUB_OUTPUT"

      - name: Stop ephemeral local Supabase (no backup)
        id: local_supabase_stop
        if: ${{ always() && steps.local_supabase_cli.outcome == 'success' }}
        working-directory: .
        run: bash frontend/e2e/scripts/local-supabase-ci.sh stop

      - name: Upload exact deterministic baseline candidates
        if: ${{ always() && steps.first_public_safety_assert.outcome == 'success' && steps.first_auth_safety_assert.outcome == 'success' && steps.first_fixture_teardown.outcome == 'success' && steps.second_public_safety_assert.outcome == 'success' && steps.second_auth_safety_assert.outcome == 'success' && steps.second_fixture_teardown.outcome == 'success' && steps.deterministic_candidates.outputs.byte_identical == 'true' && steps.local_supabase_stop.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: phase5a0d-visual-baseline-candidates-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/phase5a0d-second-candidates/
          if-no-files-found: error
          retention-days: 7
