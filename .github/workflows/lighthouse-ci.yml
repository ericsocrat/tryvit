# ═══════════════════════════════════════════════════════════════════════════════
# Lighthouse CI — Performance & Accessibility Gate (#621)
# ═══════════════════════════════════════════════════════════════════════════════
# Runs Lighthouse CI (mobile budget) on PRs that touch frontend code.
# Fails if scores drop below thresholds defined in lighthouserc.mobile.js:
#   Performance ≥ 85, Accessibility ≥ 95, Best Practices ≥ 90, CLS < 0.1
#
# Results uploaded as artifacts for investigation.
# ═══════════════════════════════════════════════════════════════════════════════

name: Lighthouse CI

on:
  pull_request:
    branches: [main]
    paths:
      - "frontend/**"
      - "supabase/config.toml"
      - ".github/workflows/lighthouse-ci.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lighthouse:
    name: Lighthouse (Mobile)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VISUAL_SAFETY_APP_ORIGIN: http://127.0.0.1:3000
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
        timeout-minutes: 8

      - name: Public visual-safety preflight
        run: npm run visual-safety:preflight
        env:
          VISUAL_SAFETY_MODE: public
          BASE_URL: http://127.0.0.1:3000

      - name: Run public Lighthouse CI
        run: npm run visual-safety:lighthouse -- mobile
        env:
          VISUAL_SAFETY_MODE: public
          BASE_URL: http://127.0.0.1:3000

      - name: Assert public visual safety
        id: safety_assert
        if: ${{ always() }}
        run: npm run visual-safety:assert
        env:
          VISUAL_SAFETY_MODE: public
          BASE_URL: http://127.0.0.1:3000

      - name: Upload reports
        if: ${{ always() && steps.safety_assert.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lighthouse-reports
          path: frontend/lighthouse-reports/
          retention-days: 14
