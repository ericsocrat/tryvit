# ═══════════════════════════════════════════════════════════════════════════════
# Quality Gate — Automated Mobile + Desktop Audit
# ═══════════════════════════════════════════════════════════════════════════════
#
# Runs the quality-gate audit runners on every PR (smoke mode) and nightly
# (full mode). Uploads screenshots, Playwright HTML report, and produces
# a GitHub Step Summary.
#
# Smoke (PR): public + local-authenticated routes × 2 viewports, plus local startup
# Full (nightly / manual): all routes × 2 viewports, plus local startup
#
# @see https://github.com/ericsocrat/tryvit/issues/178
# ═══════════════════════════════════════════════════════════════════════════════

name: Quality Gate

on:
  pull_request:
    branches: [main, codex/phase-5a0d-performance-visual-gates]
    paths:
      - "frontend/**"
      - "supabase/config.toml"
      - "supabase/migrations/**"
      - ".github/workflows/quality-gate.yml"
  schedule:
    - cron: "0 4 * * *" # Nightly at 04:00 UTC (staggered from nightly 02:00 + api-contract 03:30)
  workflow_dispatch:
    inputs:
      mode:
        description: "Run mode"
        required: true
        default: "full"
        type: choice
        options:
          - smoke
          - full

permissions:
  contents: read

concurrency:
  group: quality-gate-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_PUBLIC_QA_MODE: "1"
  # Browser safety mode is explicit per step. Authenticated coverage is valid
  # only when the local-emulator preflight succeeds.

jobs:
  quality_gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VISUAL_SAFETY_APP_ORIGIN: http://127.0.0.1:3000

    steps:
      # ── Checkout ─────────────────────────────────────────────────────────
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # ── Node.js ──────────────────────────────────────────────────────────
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      # ── Playwright browsers (cached) ─────────────────────────────────────
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Install Playwright OS deps (cached browsers)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        working-directory: frontend
        run: npx playwright install-deps chromium

      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v1
        with:
          version: 2.111.0

      # ── Determine mode ───────────────────────────────────────────────────
      - name: Determine mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "mode=smoke" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.inputs.mode }}" != "" ]; then
            echo "mode=${{ github.event.inputs.mode }}" >> "$GITHUB_OUTPUT"
          else
            echo "mode=full" >> "$GITHUB_OUTPUT"
          fi
          echo "Quality gate mode: $(cat "$GITHUB_OUTPUT" | grep mode | cut -d= -f2)"

      # ── Public audits ────────────────────────────────────────────────────
      - name: Public visual-safety preflight
        working-directory: frontend
        run: npm run visual-safety:preflight
        env:
          VISUAL_SAFETY_MODE: public
          BASE_URL: http://127.0.0.1:3000

      - name: Run public Mobile Audit
        working-directory: frontend
        run: npm run visual-safety:public -- --project=quality-mobile --reporter=html,list
        env:
          VISUAL_SAFETY_MODE: public
          QA_MODE_LEVEL: ${{ steps.mode.outputs.mode }}
          BASE_URL: http://127.0.0.1:3000

      - name: Run public Desktop Audit
        working-directory: frontend
        run: npm run visual-safety:public -- --project=quality-desktop --reporter=html,list
        env:
          VISUAL_SAFETY_MODE: public
          QA_MODE_LEVEL: ${{ steps.mode.outputs.mode }}
          BASE_URL: http://127.0.0.1:3000

      - name: Assert public visual safety
        id: public_safety_assert
        if: ${{ always() }}
        working-directory: frontend
        run: npm run visual-safety:assert
        env:
          VISUAL_SAFETY_MODE: public
          BASE_URL: http://127.0.0.1:3000

      # ── Authenticated audits: verified local emulator only ───────────────
      - name: Start ephemeral local Supabase
        id: local_supabase_start
        working-directory: .
        run: bash frontend/e2e/scripts/local-supabase-ci.sh start

      # This is intentionally blocking. The guarded preflight proves the API
      # is the configured loopback runtime before credentials or fixtures are
      # discovered. Hosted staging/production is never a fallback.
      - name: Local-authenticated visual-safety preflight (blocking)
        id: auth_preflight
        working-directory: frontend
        run: npm run visual-safety:preflight
        env:
          VISUAL_SAFETY_MODE: local-authenticated
          BASE_URL: http://127.0.0.1:3000

      - name: Seed guarded local QA fixtures
        id: local_fixture_seed
        working-directory: frontend
        shell: bash
        run: |
          fixture_ids="$RUNNER_TEMP/tryvit-qa-fixture-ids.env"
          npm run --silent visual-safety:fixtures-seed > "$fixture_ids"
          if ! grep -Eq '^QA_PRODUCT_ID=[0-9]+$' "$fixture_ids"; then
            rm -f -- "$fixture_ids"
            echo "::error::Guarded local fixture seeding did not return deterministic IDs"
            exit 1
          fi
          grep -E '^QA_[A-Z_]+=[A-Za-z0-9_-]+$' "$fixture_ids" >> "$GITHUB_ENV"
          rm -f -- "$fixture_ids"
          echo "seeded=true" >> "$GITHUB_OUTPUT"

      - name: Run local-authenticated Mobile Audit
        working-directory: frontend
        run: npm run visual-safety:local-authenticated -- --project=quality-mobile --reporter=html,list
        env:
          VISUAL_SAFETY_MODE: local-authenticated
          QA_MODE_LEVEL: ${{ steps.mode.outputs.mode }}
          BASE_URL: http://127.0.0.1:3000

      - name: Run local-authenticated Desktop Audit
        working-directory: frontend
        run: npm run visual-safety:local-authenticated -- --project=quality-desktop --reporter=html,list
        env:
          VISUAL_SAFETY_MODE: local-authenticated
          QA_MODE_LEVEL: ${{ steps.mode.outputs.mode }}
          BASE_URL: http://127.0.0.1:3000

      - name: Assert local-authenticated visual safety
        id: auth_safety_assert
        if: ${{ always() && steps.auth_preflight.outcome == 'success' }}
        working-directory: frontend
        run: npm run visual-safety:assert
        env:
          VISUAL_SAFETY_MODE: local-authenticated
          BASE_URL: http://127.0.0.1:3000

      - name: Teardown guarded local QA fixtures
        id: local_fixture_teardown
        if: ${{ always() && steps.local_fixture_seed.outputs.seeded == 'true' }}
        working-directory: frontend
        run: npm run --silent visual-safety:fixtures-teardown

      - name: Stop ephemeral local Supabase (no backup)
        id: local_supabase_stop
        if: ${{ always() }}
        working-directory: .
        run: bash frontend/e2e/scripts/local-supabase-ci.sh stop

      # ── Upload Artifacts ─────────────────────────────────────────────────
      - name: Upload Screenshots
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ always() && steps.public_safety_assert.outcome == 'success' && steps.auth_safety_assert.outcome == 'success' && steps.local_fixture_teardown.outcome == 'success' && steps.local_supabase_stop.outcome == 'success' }}
        with:
          name: qa-screenshots-${{ steps.mode.outputs.mode }}
          path: frontend/qa_screenshots/latest/
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload Playwright Report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ always() && steps.public_safety_assert.outcome == 'success' && steps.auth_safety_assert.outcome == 'success' && steps.local_fixture_teardown.outcome == 'success' && steps.local_supabase_stop.outcome == 'success' }}
        with:
          name: playwright-quality-report
          path: frontend/playwright-report/
          retention-days: 14
          if-no-files-found: ignore

      # ── Step Summary ─────────────────────────────────────────────────────
      - name: Quality Gate Summary
        if: always()
        run: |
          {
            echo "## Quality Gate Results"
            echo ""
            echo "| Key | Value |"
            echo "|-----|-------|"
            echo "| **Mode** | \`${{ steps.mode.outputs.mode }}\` |"
            echo "| **Trigger** | \`${{ github.event_name }}\` |"
            echo "| **Commit** | \`${{ github.sha }}\` |"
            echo "| **Public safety assertion** | \`${{ steps.public_safety_assert.outcome }}\` |"
            echo "| **Local runtime startup** | \`${{ steps.local_supabase_start.outcome }}\` |"
            echo "| **Local-auth preflight** | \`${{ steps.auth_preflight.outcome }}\` |"
            echo "| **Local-auth safety assertion** | \`${{ steps.auth_safety_assert.outcome }}\` |"
            echo "| **Local fixture teardown** | \`${{ steps.local_fixture_teardown.outcome }}\` |"
            echo "| **Local runtime teardown** | \`${{ steps.local_supabase_stop.outcome }}\` |"
            echo ""
            echo "### Lighthouse boundary"
            echo "- Quality Gate contains no Lighthouse execution; it remains authoritative for public and local-authenticated browser behavior only."
            echo "- The separate guarded Phase 5A.0d Lighthouse workflow owns public and local-authenticated Mobile and Desktop five-run enforcement."
            echo "- Historical /auth/login scores of 0.66, 0.69, and 0.64 are retained as evidence of the corrected measurement-contract defect, not as a current pass or current gate result."
            echo ""
            echo "### Artifacts"
            echo "- Artifacts upload only after applicable safety assertions pass (14-day retention)."
            echo "- Authenticated coverage is local-emulator-only; missing runtime, fixtures, or cleanup is blocking and is never replaced by hosted or public coverage."
          } >> "$GITHUB_STEP_SUMMARY"

      # ── Optional: Nightly failure notification ───────────────────────────
      - name: Notify on nightly failure
        if: failure() && github.event_name == 'schedule'
        env:
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
        run: |
          if [ -n "$ALERT_WEBHOOK_URL" ]; then
            curl -sS -X POST "$ALERT_WEBHOOK_URL" \
              -H 'Content-Type: application/json' \
              -d "{\"text\": \"Quality Gate nightly FAILED — https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
              || true
          fi
