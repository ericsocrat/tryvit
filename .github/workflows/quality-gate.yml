# ═══════════════════════════════════════════════════════════════════════════════
# Quality Gate — Automated Mobile + Desktop Audit
# ═══════════════════════════════════════════════════════════════════════════════
#
# Runs the quality-gate audit runners on every PR (smoke mode) and nightly
# (full mode). Uploads screenshots, Playwright HTML report, and produces
# a GitHub Step Summary.
#
# Smoke (PR):   ~9 routes × 2 viewports  → < 5 min
# Full (nightly / manual):  ~40 routes × 2 viewports  → ~18 min
#
# @see https://github.com/ericsocrat/tryvit/issues/178
# ═══════════════════════════════════════════════════════════════════════════════

name: Quality Gate

on:
  pull_request:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/quality-gate.yml"
  schedule:
    - cron: "0 4 * * *" # Nightly at 04:00 UTC (staggered from nightly 02:00 + api-contract 03:30)
  workflow_dispatch:
    inputs:
      mode:
        description: "Run mode"
        required: true
        default: "full"
        type: choice
        options:
          - smoke
          - full

permissions:
  contents: read

concurrency:
  group: quality-gate-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_PUBLIC_QA_MODE: "1"
  # Fixture IDs are seeded dynamically by the "Seed QA fixture data" step.
  # Override via QA_PRODUCT_ID, QA_CATEGORY_SLUG secrets if needed.

jobs:
  quality_gate:
    # Dependabot cannot read the Supabase runtime and staging secrets needed
    # to start the audited app. Its PRs remain covered by PR Gate (build,
    # lint, unit, and Playwright) plus the separate Lighthouse workflow.
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # ── Checkout ─────────────────────────────────────────────────────────
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # ── Node.js ──────────────────────────────────────────────────────────
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      # ── Playwright browsers (cached) ─────────────────────────────────────
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Install Playwright OS deps (cached browsers)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        working-directory: frontend
        run: npx playwright install-deps chromium

      # ── Build ────────────────────────────────────────────────────────────
      - name: Build application
        working-directory: frontend
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL_STAGING || secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY_STAGING || secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      # ── Start application ──────────────────────────────────────────────────────
      - name: Start application
        working-directory: frontend
        run: npm run start &
        env:
          PORT: 3000
          # Server-side code (middleware, server components) needs these at
          # runtime; NEXT_PUBLIC_* are baked into the client bundle at build
          # time but process.env reads in Node.js require the actual values.
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL_STAGING || secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY_STAGING || secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Wait for app ready
        run: npx wait-on http://localhost:3000 --timeout 60000

      # Dependabot-triggered workflows cannot read ordinary Actions secrets.
      # Keep build/test coverage active, but skip staging-only fixture audits
      # when those credentials are unavailable instead of reporting a false
      # application failure.
      - name: Check staging credentials
        id: staging
        env:
          STAGING_URL: ${{ secrets.SUPABASE_URL_STAGING }}
          STAGING_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY_STAGING }}
        run: |
          if [ -n "$STAGING_URL" ] && [ -n "$STAGING_SERVICE_KEY" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Staging credentials unavailable; skipping fixture-dependent quality audits."
          fi

      # ── Seed QA fixture data ──────────────────────────────────────────────
      - name: Seed QA fixture data
        if: steps.staging.outputs.available == 'true'
        id: seed
        working-directory: frontend
        run: |
          set -o pipefail
          # Seed deterministic test products; KEY=VALUE lines go to stdout.
          # No `|| true` here — a non-zero exit (missing staging env in CI, or
          # the in-script production guard tripping) MUST fail the job rather
          # than let the quality gate pass green with nothing seeded.
          node tests/quality/seed-fixtures.mjs | tee /tmp/qa-ids.txt
          grep -E '^[A-Z_]+=' /tmp/qa-ids.txt >> "$GITHUB_ENV" || true
          echo "seeded=true" >> "$GITHUB_OUTPUT"
        env:
          # Staging-only: QA fixtures must NEVER target production. No fallback
          # to NEXT_PUBLIC_SUPABASE_URL — if the staging secret is unset the
          # seeder fails in CI (and the in-script production guard would abort
          # anyway).
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL_STAGING }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY_STAGING }}

      # ── Determine mode ───────────────────────────────────────────────────
      - name: Determine mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "mode=smoke" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.inputs.mode }}" != "" ]; then
            echo "mode=${{ github.event.inputs.mode }}" >> "$GITHUB_OUTPUT"
          else
            echo "mode=full" >> "$GITHUB_OUTPUT"
          fi
          echo "Quality gate mode: $(cat "$GITHUB_OUTPUT" | grep mode | cut -d= -f2)"

      # ── Check auth credentials ──────────────────────────────────────────
      - name: Check auth credentials
        id: auth
        run: |
          if [ -n "$QA_TEST_EMAIL" ] && [ -n "$QA_TEST_PASSWORD" ]; then
            echo "has_auth=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_auth=false" >> "$GITHUB_OUTPUT"
            echo "⚠️  Missing QA_TEST_EMAIL and/or QA_TEST_PASSWORD — Lighthouse audits will be skipped"
          fi
        env:
          QA_TEST_EMAIL: ${{ secrets.QA_TEST_EMAIL }}
          QA_TEST_PASSWORD: ${{ secrets.QA_TEST_PASSWORD }}

      # ── Mobile Audit ─────────────────────────────────────────────────────
      - name: Run Mobile Audit
        if: steps.staging.outputs.available == 'true'
        working-directory: frontend
        run: npx playwright test --project=quality-mobile --reporter=html,list
        env:
          QA_MODE_LEVEL: ${{ steps.mode.outputs.mode }}
          BASE_URL: http://localhost:3000
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY_STAGING || secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL_STAGING || secrets.NEXT_PUBLIC_SUPABASE_URL }}

      # ── Desktop Audit ────────────────────────────────────────────────────
      # No `if: always()` — the quality-desktop project is only registered when
      # QA_MODE_LEVEL is set (HAS_QUALITY in playwright.config.ts). That value
      # comes from the "Determine mode" step, which is skipped if seeding fails.
      # Running this on failure would surface a misleading "project not found"
      # error instead of the real seed failure, so it mirrors the Mobile Audit
      # step and only runs when prior steps succeed.
      - name: Run Desktop Audit
        if: steps.staging.outputs.available == 'true'
        working-directory: frontend
        run: npx playwright test --project=quality-desktop --reporter=html,list
        env:
          QA_MODE_LEVEL: ${{ steps.mode.outputs.mode }}
          BASE_URL: http://localhost:3000
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY_STAGING || secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL_STAGING || secrets.NEXT_PUBLIC_SUPABASE_URL }}

      # ── Teardown QA fixtures ─────────────────────────────────────────────
      # Always runs after the fixture-dependent audits so staging never
      # accumulates active QA Test Brand rows. Staging-only secrets; the
      # in-script production guard makes targeting production impossible.
      # In CI a missing staging secret fails this step (exit 1) rather than
      # leaving fixtures behind silently.
      - name: Teardown QA fixture data
        if: always() && steps.seed.outputs.seeded == 'true'
        working-directory: frontend
        run: node tests/quality/seed-fixtures.mjs --teardown
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL_STAGING }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY_STAGING }}

      # ── Lighthouse CI (Mobile) ─────────────────────────────────────────
      - name: Run Lighthouse CI (Mobile)
        working-directory: frontend
        if: always() && steps.auth.outputs.has_auth == 'true'
        run: npx lhci autorun --config=lighthouserc.mobile.js
        env:
          QA_TEST_EMAIL: ${{ secrets.QA_TEST_EMAIL }}
          QA_TEST_PASSWORD: ${{ secrets.QA_TEST_PASSWORD }}
          QA_PRODUCT_ID: ${{ secrets.QA_PRODUCT_ID }}

      # ── Lighthouse CI (Desktop) ────────────────────────────────────────
      - name: Run Lighthouse CI (Desktop)
        working-directory: frontend
        if: always() && steps.auth.outputs.has_auth == 'true'
        run: npx lhci autorun --config=lighthouserc.desktop.js
        env:
          QA_TEST_EMAIL: ${{ secrets.QA_TEST_EMAIL }}
          QA_TEST_PASSWORD: ${{ secrets.QA_TEST_PASSWORD }}
          QA_PRODUCT_ID: ${{ secrets.QA_PRODUCT_ID }}

      # ── Upload Artifacts ─────────────────────────────────────────────────
      - name: Upload Screenshots
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: qa-screenshots-${{ steps.mode.outputs.mode }}
          path: frontend/qa_screenshots/latest/
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload Playwright Report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: playwright-quality-report
          path: frontend/playwright-report/
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload Lighthouse Reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: lighthouse-reports-${{ steps.mode.outputs.mode }}
          path: frontend/lighthouse-reports/
          retention-days: 14
          if-no-files-found: ignore

      # ── Step Summary ─────────────────────────────────────────────────────
      - name: Quality Gate Summary
        if: always()
        run: |
          echo "## Quality Gate Results" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Key | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Mode** | \`${{ steps.mode.outputs.mode }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Trigger** | \`${{ github.event_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Commit** | \`${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Artifacts" >> "$GITHUB_STEP_SUMMARY"
          echo "- Screenshots, Playwright Report, Lighthouse Reports uploaded (14-day retention)" >> "$GITHUB_STEP_SUMMARY"

      # ── Optional: Nightly failure notification ───────────────────────────
      - name: Notify on nightly failure
        if: failure() && github.event_name == 'schedule'
        env:
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
        run: |
          if [ -n "$ALERT_WEBHOOK_URL" ]; then
            curl -sS -X POST "$ALERT_WEBHOOK_URL" \
              -H 'Content-Type: application/json' \
              -d "{\"text\": \"Quality Gate nightly FAILED — https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
              || true
          fi
