# ═══════════════════════════════════════════════════════════════════════════════
# CodeQL Security Analysis — Static Application Security Testing (SAST)
# ═══════════════════════════════════════════════════════════════════════════════
# Scans JavaScript/TypeScript for vulnerability patterns:
#   • SQL / NoSQL injection               • Unsafe deserialization
#   • Server-side request forgery (SSRF)  • Dangerous eval / code injection
#   • Path traversal                      • Cryptographic misuse
#   • Incomplete URL validation           • Regex denial of service (ReDoS)
#
# Triggers: every push to main, every PR to main or the reviewed Phase 5A.0d
# stacked base, and weekly Monday 06:00 UTC.
# Weekly scheduled scan catches vulnerabilities introduced by dependency
# updates that land outside normal PR flow (e.g. Dependabot auto-merge).
#
# Results appear in GitHub Security → Code scanning alerts.
# ═══════════════════════════════════════════════════════════════════════════════

name: CodeQL Security Analysis

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/**"
      - "**.js"
      - "**.ts"
      - "**.tsx"
      - "**.py"
      - "requirements*.txt"
      - "pyproject.toml"
  pull_request:
    branches: [main, codex/phase-5a0d-performance-visual-gates]
    # No paths filter — the code_scanning ruleset rule requires CodeQL to
    # report results for every PR commit.  On non-code PRs the analysis
    # completes in seconds (nothing to scan) and uploads an empty SARIF.
  schedule:
    # Weekly Monday 06:00 UTC — catches drift from auto-merged deps
    - cron: "0 6 * * 1"

permissions:
  actions: read
  contents: read
  security-events: write # Required to upload SARIF results

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        language: ["javascript-typescript", "python"]
        # Ingestion is a product-critical trust boundary, even when not served
        # by Vercel. Analyze both supported implementation languages.

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          languages: ${{ matrix.language }}
          # Extended queries catch more issues at cost of some false positives.
          # security-extended is the sweet spot for production codebases.
          queries: security-extended
          # Trap directory for build tracing
          config: |
            paths-ignore:
              - "node_modules"
              - ".next"
              - "coverage"
              - "playwright-report"
              - "test-results"
              - "**/*.test.ts"
              - "**/*.test.tsx"
              - "**/*.spec.ts"

      - name: Autobuild
        uses: github/codeql-action/autobuild@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          category: "/language:${{ matrix.language }}"
          # Upload results to GitHub Security tab
          upload: always

      - name: Summary
        if: ${{ !cancelled() }}
        run: |
          {
            echo "## CodeQL Security Analysis"
            echo ""
            echo "Language: **${{ matrix.language }}**"
            echo "Query suite: **security-extended**"
            echo ""
            echo "Results: [Security → Code scanning](https://github.com/${{ github.repository }}/security/code-scanning)"
          } >> "$GITHUB_STEP_SUMMARY"
