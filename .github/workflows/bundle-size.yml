name: Route JavaScript Regression Guard

on:
  pull_request:
    branches: [main, codex/phase-5a0d-performance-visual-gates]
    paths:
      - "frontend/**"
      - "supabase/config.toml"
      - "supabase/migrations/**"
      - ".github/workflows/bundle-size.yml"

permissions:
  contents: read

concurrency:
  group: route-js-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  compare:
    name: Cold route JS (base vs head)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      VISUAL_SAFETY_APP_ORIGIN: http://127.0.0.1:3000
      BASE_URL: http://127.0.0.1:3000
      NPM_CONFIG_IGNORE_SCRIPTS: "true"
    defaults:
      run:
        working-directory: frontend

    steps:
      # Base and head are deliberately measured serially on this one runner.
      # The guarded Playwright project creates a fresh browser context per
      # representative route and inventories gzip-compressed response bytes.
      - name: Checkout pull-request measurement harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      # Preserve the head copy only for the one-time bootstrap from the exact
      # verified Phase 5A.0c base. After this phase lands, the reviewed PR-base
      # harness is authoritative for both revisions and PR code cannot redefine
      # the comparator that judges itself.
      - name: Preserve head harness for guarded bootstrap only
        working-directory: .
        shell: bash
        run: |
          cp -- frontend/package.json "$RUNNER_TEMP/phase5a0d-head-package.json"
          tar -cf "$RUNNER_TEMP/phase5a0d-head-route-js-harness.tar" \
            frontend/playwright.config.ts \
            frontend/e2e \
            frontend/tooling

      - name: Checkout pull-request base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Select the reviewed base harness or exact one-time bootstrap
        id: harness_policy
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          base_sha="$(git rev-parse HEAD)"
          head_sha="${{ github.event.pull_request.head.sha }}"
          phase5a0c_base="f03a79c97f9edc495a62fa02e89c45938a42fc6e"
          reviewed_phase5a0d_head="2b097bbe9eb0b3501421f1250972c98ce24ce60b"
          if [ -f frontend/tooling/phase5a0d-route-js.ts ] && \
             [ -f frontend/tooling/phase5a0d-route-js-cli.mts ] && \
             [ -f frontend/tooling/phase5a0d-contract.ts ] && \
             [ -f frontend/e2e/phase5a0d-route-js.spec.ts ] && \
             [ ! -L frontend/tooling ] && [ ! -L frontend/e2e ]; then
            cp -- frontend/package.json "$RUNNER_TEMP/phase5a0d-reviewed-package.json"
            tar -cf "$RUNNER_TEMP/phase5a0d-reviewed-route-js-harness.tar" \
              frontend/playwright.config.ts \
              frontend/e2e \
              frontend/tooling
            echo "source=pr-base" >> "$GITHUB_OUTPUT"
            echo "trusted=true" >> "$GITHUB_OUTPUT"
          else
            if [ "$base_sha" != "$phase5a0c_base" ]; then
              if ! git merge-base --is-ancestor "$phase5a0c_base" "$base_sha" || \
                 ! git merge-base --is-ancestor "$base_sha" "$head_sha" || \
                 ! git merge-base --is-ancestor "$reviewed_phase5a0d_head" "$head_sha"; then
                echo "::error::Synchronized bootstrap ancestry cannot be proven."
                exit 1
              fi
              unexpected_base_paths="$(git diff --name-only "$phase5a0c_base" "$base_sha" -- | grep -Ev '^frontend/package(-lock)?\.json$' || true)"
              if [ -n "$unexpected_base_paths" ]; then
                echo "::error::The synchronized PR base contains changes outside the two dependency manifests."
                exit 1
              fi
              if ! git diff --quiet "$reviewed_phase5a0d_head" "$head_sha" -- \
                frontend/playwright.config.ts frontend/e2e frontend/tooling; then
                echo "::error::The reviewed Phase 5A.0d route-JS harness changed after synchronization."
                exit 1
              fi
              git show "$reviewed_phase5a0d_head:frontend/package.json" > "$RUNNER_TEMP/phase5a0d-approved-package.json"
              node -e 'const fs = require("fs"); const strip = (value) => { const copy = structuredClone(value); delete copy.dependencies; delete copy.devDependencies; return copy; }; const approved = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/phase5a0d-approved-package.json", "utf8")); const synchronized = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/phase5a0d-head-package.json", "utf8")); if (JSON.stringify(strip(approved)) !== JSON.stringify(strip(synchronized))) throw new Error("synchronized package changed outside dependency versions");'
              if ! cmp --silent \
                <(git show "$base_sha:frontend/package-lock.json") \
                <(git show "$head_sha:frontend/package-lock.json"); then
                echo "::error::The synchronized head does not preserve the exact current-main lockfile."
                exit 1
              fi
            fi
            cp -- "$RUNNER_TEMP/phase5a0d-head-package.json" "$RUNNER_TEMP/phase5a0d-reviewed-package.json"
            cp -- "$RUNNER_TEMP/phase5a0d-head-route-js-harness.tar" "$RUNNER_TEMP/phase5a0d-reviewed-route-js-harness.tar"
            echo "source=synchronized-phase5a0d-bootstrap-informational-only" >> "$GITHUB_OUTPUT"
            echo "trusted=false" >> "$GITHUB_OUTPUT"
            echo "::notice::The attested Phase 5A.0d bootstrap may produce illustrative base/head evidence, but cannot enforce a trusted regression until the reviewed harness exists on the PR base."
          fi
          echo "archive_sha256=$(sha256sum "$RUNNER_TEMP/phase5a0d-reviewed-route-js-harness.tar" | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "package_sha256=$(sha256sum "$RUNNER_TEMP/phase5a0d-reviewed-package.json" | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Restore identical reviewed measurement harness onto base
        working-directory: .
        shell: bash
        run: tar -xf "$RUNNER_TEMP/phase5a0d-reviewed-route-js-harness.tar"

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.21.1
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Add measurement-only npm entry points to base
        shell: bash
        run: |
          node <<'NODE'
          const fs = require("fs");
          const base = JSON.parse(fs.readFileSync("package.json", "utf8"));
          const reviewed = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/phase5a0d-reviewed-package.json", "utf8"));
          const allowedNames = [
            "visual-safety:preflight",
            "visual-safety:assert",
            "visual-safety:public",
            "visual-safety:local-authenticated",
            "visual-safety:fixtures-seed",
            "visual-safety:fixtures-teardown",
            "phase5:route-js",
            "phase5:route-js:public",
            "phase5:route-js:authenticated",
          ];
          for (const name of allowedNames) {
            if (typeof reviewed.scripts?.[name] !== "string") throw new Error(`missing harness script: ${name}`);
            base.scripts[name] = reviewed.scripts[name];
          }
          fs.writeFileSync("package.json", JSON.stringify(base, null, 2) + "\n");
          NODE

      - name: Install base dependencies
        run: npm ci

      - name: Install base lockfile-pinned Chromium
        run: npx playwright install --with-deps chromium
        timeout-minutes: 8

      - name: Setup pinned Supabase CLI
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v1
        with:
          version: 2.111.0

      - name: Base public visual-safety preflight
        run: npm run visual-safety:preflight
        env:
          VISUAL_SAFETY_MODE: public

      - name: Capture base public routes in cold browsers
        id: base_public_capture
        run: npm run phase5:route-js:public

      - name: Assert base public visual safety
        id: base_public_safety_assert
        if: ${{ always() }}
        run: npm run visual-safety:assert
        env:
          VISUAL_SAFETY_MODE: public

      - name: Compile base public route report
        if: ${{ steps.base_public_capture.outcome == 'success' && steps.base_public_safety_assert.outcome == 'success' }}
        run: npm run phase5:route-js -- compile-mode --mode=public --capture-directory=performance-reports/route-js-captures/public --output=performance-reports/route-js/base-public.json

      - name: Start base ephemeral local Supabase
        id: base_local_supabase_start
        if: ${{ !cancelled() && steps.base_public_capture.outcome == 'success' && steps.base_public_safety_assert.outcome == 'success' }}
        working-directory: .
        run: bash frontend/e2e/scripts/local-supabase-ci.sh start

      - name: Base local-authenticated visual-safety preflight (blocking)
        id: base_auth_preflight
        if: ${{ !cancelled() && steps.base_local_supabase_start.outcome == 'success' }}
        run: npm run visual-safety:preflight
        env:
          VISUAL_SAFETY_MODE: local-authenticated

      - name: Seed guarded base fixtures
        id: base_fixture_seed
        if: ${{ !cancelled() && steps.base_auth_preflight.outcome == 'success' }}
        shell: bash
        run: |
          fixture_ids="$RUNNER_TEMP/tryvit-base-route-js-fixture-ids.env"
          npm run --silent visual-safety:fixtures-seed > "$fixture_ids"
          if ! grep -Eq '^QA_PRODUCT_ID=[0-9]+$' "$fixture_ids"; then
            rm -f -- "$fixture_ids"
            echo "::error::Guarded base fixture seeding did not return deterministic IDs"
            exit 1
          fi
          grep -E '^QA_[A-Z_]+=[A-Za-z0-9_-]+$' "$fixture_ids" >> "$GITHUB_ENV"
          rm -f -- "$fixture_ids"
          echo "seeded=true" >> "$GITHUB_OUTPUT"

      - name: Capture base authenticated routes in cold browsers
        id: base_auth_capture
        if: ${{ !cancelled() && steps.base_fixture_seed.outputs.seeded == 'true' }}
        run: npm run phase5:route-js:authenticated

      - name: Assert base local-authenticated visual safety
        id: base_auth_safety_assert
        if: ${{ always() && steps.base_auth_preflight.outcome == 'success' }}
        run: npm run visual-safety:assert
        env:
          VISUAL_SAFETY_MODE: local-authenticated

      - name: Compile base authenticated route report
        if: ${{ steps.base_auth_capture.outcome == 'success' && steps.base_auth_safety_assert.outcome == 'success' }}
        run: npm run phase5:route-js -- compile-mode --mode=local-authenticated --capture-directory=performance-reports/route-js-captures/local-authenticated --output=performance-reports/route-js/base-authenticated.json

      - name: Teardown guarded base fixtures
        id: base_fixture_teardown
        if: ${{ always() && steps.base_fixture_seed.outputs.seeded == 'true' }}
        run: npm run --silent visual-safety:fixtures-teardown

      - name: Stop base ephemeral local Supabase (no backup)
        id: base_local_supabase_stop
        if: ${{ always() }}
        working-directory: .
        run: bash frontend/e2e/scripts/local-supabase-ci.sh stop

      - name: Combine complete base route matrix
        if: ${{ steps.base_public_safety_assert.outcome == 'success' && steps.base_auth_safety_assert.outcome == 'success' && steps.base_fixture_teardown.outcome == 'success' && steps.base_local_supabase_stop.outcome == 'success' }}
        run: npm run phase5:route-js -- combine --public=performance-reports/route-js/base-public.json --local-authenticated=performance-reports/route-js/base-authenticated.json --output=performance-reports/route-js/base-route-js.json

      - name: Preserve validated base report across the head checkout
        id: preserve_base_report
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          cp -- performance-reports/route-js/base-route-js.json "$RUNNER_TEMP/base-route-js.json"
          echo "sha256=$(sha256sum "$RUNNER_TEMP/base-route-js.json" | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Checkout pull-request head on the same runner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Install head dependencies
        run: npm ci --ignore-scripts

      - name: Install head lockfile-pinned Chromium
        run: npx playwright install --with-deps chromium
        timeout-minutes: 8

      - name: Reinstall head dependencies from lockfile after browser setup
        run: npm ci --ignore-scripts --prefer-offline

      # Head-controlled dependency lifecycle scripts run before this point.
      # Re-attest and restore the reviewed archive afterwards so they cannot
      # replace the comparator, fixture contract, or preserved base evidence.
      - name: Re-attest and restore the reviewed base harness onto head
        working-directory: .
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          git diff --quiet HEAD --
          echo "${{ steps.harness_policy.outputs.archive_sha256 }}  $RUNNER_TEMP/phase5a0d-reviewed-route-js-harness.tar" | sha256sum -c -
          echo "${{ steps.harness_policy.outputs.package_sha256 }}  $RUNNER_TEMP/phase5a0d-reviewed-package.json" | sha256sum -c -
          echo "${{ steps.preserve_base_report.outputs.sha256 }}  $RUNNER_TEMP/base-route-js.json" | sha256sum -c -
          rm -rf -- frontend/e2e frontend/tooling frontend/playwright.config.ts
          tar -xf "$RUNNER_TEMP/phase5a0d-reviewed-route-js-harness.tar"

      - name: Add reviewed measurement-only npm entry points to head
        shell: bash
        run: |
          node <<'NODE'
          const fs = require("fs");
          const current = JSON.parse(fs.readFileSync("package.json", "utf8"));
          const reviewed = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/phase5a0d-reviewed-package.json", "utf8"));
          const allowedNames = [
            "visual-safety:preflight",
            "visual-safety:assert",
            "visual-safety:public",
            "visual-safety:local-authenticated",
            "visual-safety:fixtures-seed",
            "visual-safety:fixtures-teardown",
            "phase5:route-js",
            "phase5:route-js:public",
            "phase5:route-js:authenticated",
          ];
          const scripts = {};
          for (const name of allowedNames) {
            if (typeof reviewed.scripts?.[name] !== "string") throw new Error(`missing harness script: ${name}`);
            scripts[name] = reviewed.scripts[name];
          }
          current.scripts = scripts;
          fs.writeFileSync("package.json", JSON.stringify(current, null, 2) + "\n");
          NODE

      - name: Head public visual-safety preflight
        run: npm run visual-safety:preflight
        env:
          VISUAL_SAFETY_MODE: public

      - name: Capture head public routes in cold browsers
        id: head_public_capture
        run: npm run phase5:route-js:public

      - name: Assert head public visual safety
        id: head_public_safety_assert
        if: ${{ always() }}
        run: npm run visual-safety:assert
        env:
          VISUAL_SAFETY_MODE: public

      - name: Compile head public route report
        if: ${{ steps.head_public_capture.outcome == 'success' && steps.head_public_safety_assert.outcome == 'success' }}
        run: npm run phase5:route-js -- compile-mode --mode=public --capture-directory=performance-reports/route-js-captures/public --output=performance-reports/route-js/head-public.json

      - name: Start head ephemeral local Supabase
        id: head_local_supabase_start
        if: ${{ !cancelled() && steps.head_public_capture.outcome == 'success' && steps.head_public_safety_assert.outcome == 'success' }}
        working-directory: .
        run: bash frontend/e2e/scripts/local-supabase-ci.sh start

      - name: Head local-authenticated visual-safety preflight (blocking)
        id: head_auth_preflight
        if: ${{ !cancelled() && steps.head_local_supabase_start.outcome == 'success' }}
        run: npm run visual-safety:preflight
        env:
          VISUAL_SAFETY_MODE: local-authenticated

      - name: Seed guarded head fixtures
        id: head_fixture_seed
        if: ${{ !cancelled() && steps.head_auth_preflight.outcome == 'success' }}
        shell: bash
        run: |
          fixture_ids="$RUNNER_TEMP/tryvit-head-route-js-fixture-ids.env"
          npm run --silent visual-safety:fixtures-seed > "$fixture_ids"
          if ! grep -Eq '^QA_PRODUCT_ID=[0-9]+$' "$fixture_ids"; then
            rm -f -- "$fixture_ids"
            echo "::error::Guarded head fixture seeding did not return deterministic IDs"
            exit 1
          fi
          grep -E '^QA_[A-Z_]+=[A-Za-z0-9_-]+$' "$fixture_ids" >> "$GITHUB_ENV"
          rm -f -- "$fixture_ids"
          echo "seeded=true" >> "$GITHUB_OUTPUT"

      - name: Capture head authenticated routes in cold browsers
        id: head_auth_capture
        if: ${{ !cancelled() && steps.head_fixture_seed.outputs.seeded == 'true' }}
        run: npm run phase5:route-js:authenticated

      - name: Assert head local-authenticated visual safety
        id: head_auth_safety_assert
        if: ${{ always() && steps.head_auth_preflight.outcome == 'success' }}
        run: npm run visual-safety:assert
        env:
          VISUAL_SAFETY_MODE: local-authenticated

      - name: Compile head authenticated route report
        if: ${{ steps.head_auth_capture.outcome == 'success' && steps.head_auth_safety_assert.outcome == 'success' }}
        run: npm run phase5:route-js -- compile-mode --mode=local-authenticated --capture-directory=performance-reports/route-js-captures/local-authenticated --output=performance-reports/route-js/head-authenticated.json

      - name: Teardown guarded head fixtures
        id: head_fixture_teardown
        if: ${{ always() && steps.head_fixture_seed.outputs.seeded == 'true' }}
        run: npm run --silent visual-safety:fixtures-teardown

      - name: Stop head ephemeral local Supabase (no backup)
        id: head_local_supabase_stop
        if: ${{ always() }}
        working-directory: .
        run: bash frontend/e2e/scripts/local-supabase-ci.sh stop

      - name: Combine complete head route matrix
        if: ${{ steps.head_public_safety_assert.outcome == 'success' && steps.head_auth_safety_assert.outcome == 'success' && steps.head_fixture_teardown.outcome == 'success' && steps.head_local_supabase_stop.outcome == 'success' }}
        run: npm run phase5:route-js -- combine --public=performance-reports/route-js/head-public.json --local-authenticated=performance-reports/route-js/head-authenticated.json --output=performance-reports/route-js/head-route-js.json

      - name: Restore validated base report into the owned report root
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          echo "${{ steps.preserve_base_report.outputs.sha256 }}  $RUNNER_TEMP/base-route-js.json" | sha256sum -c -
          cp -- "$RUNNER_TEMP/base-route-js.json" performance-reports/route-js/base-route-js.json

      - name: Compare route JavaScript (+10 KiB OR +5% fails; reductions pass)
        id: route_compare
        shell: bash
        run: |
          set +e
          npm run phase5:route-js -- compare --baseline=performance-reports/route-js/base-route-js.json --current=performance-reports/route-js/head-route-js.json --markdown=performance-reports/route-js/route-js-comparison.md
          comparison_exit=$?
          set -e
          echo "exit_code=$comparison_exit" >> "$GITHUB_OUTPUT"

      - name: Stage compact route JavaScript evidence
        id: route_evidence_stage
        if: ${{ always() && steps.base_public_safety_assert.outcome == 'success' && steps.base_auth_safety_assert.outcome == 'success' && steps.base_fixture_teardown.outcome == 'success' && steps.base_local_supabase_stop.outcome == 'success' && steps.head_public_safety_assert.outcome == 'success' && steps.head_auth_safety_assert.outcome == 'success' && steps.head_fixture_teardown.outcome == 'success' && steps.head_local_supabase_stop.outcome == 'success' }}
        shell: bash
        run: |
          evidence="$RUNNER_TEMP/route-js-evidence"
          mkdir -p -- "$evidence"
          test -s performance-reports/route-js/base-route-js.json
          test -s performance-reports/route-js/head-route-js.json
          test -s performance-reports/route-js/route-js-comparison.md
          cp -- performance-reports/route-js/base-route-js.json "$evidence/base-route-js.json"
          cp -- performance-reports/route-js/head-route-js.json "$evidence/head-route-js.json"
          cp -- performance-reports/route-js/route-js-comparison.md "$evidence/route-js-comparison.md"
          printf '%s\n' \
            '{"schemaVersion":1,"baseSha":"${{ github.event.pull_request.base.sha }}","headSha":"${{ github.event.pull_request.head.sha }}","harnessSource":"${{ steps.harness_policy.outputs.source }}","regressionEnforced":${{ steps.harness_policy.outputs.trusted }}}' \
            > "$evidence/provenance.json"
          test "$(find "$evidence" -maxdepth 1 -type f | wc -l)" -eq 4

      - name: Upload compact route JavaScript evidence
        if: ${{ always() && steps.route_evidence_stage.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: route-js-phase5a0d-evidence
          path: ${{ runner.temp }}/route-js-evidence/
          if-no-files-found: error
          retention-days: 14

      - name: Enforce route regression threshold
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          if [ "${{ steps.route_evidence_stage.outcome }}" != "success" ]; then
            echo "::error::Complete route-JavaScript evidence was not produced after safety and cleanup."
            exit 1
          fi
          if [ "${{ steps.harness_policy.outputs.trusted }}" != "true" ]; then
            echo "::notice::Bootstrap evidence is informational because the comparator does not yet exist on the exact PR base. Regression enforcement activates after the reviewed harness lands."
            exit 0
          fi
          if [ "${{ steps.route_compare.outputs.exit_code }}" != "0" ]; then
            echo "::error::A representative route grew by more than 10 KiB or 5%."
            exit 1
          fi
