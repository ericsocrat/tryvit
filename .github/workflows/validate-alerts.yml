# ═══════════════════════════════════════════════════════════════════════════════
# Validate Alerts — YAML lint + schema validation for monitoring/alerts.yml
# ═══════════════════════════════════════════════════════════════════════════════
# Triggered on changes to monitoring/ directory. Validates that alerts.yml
# is well-formed and every alert has required fields with valid values.
# ═══════════════════════════════════════════════════════════════════════════════

name: Validate Alerts

on:
  push:
    branches: [main]
    paths:
      - "monitoring/**"
  pull_request:
    branches: [main]
    paths:
      - "monitoring/**"

permissions:
  contents: read

jobs:
  validate:
    name: Alert Config Validation
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Validate alerts.yml
        run: python scripts/validate_alerts.py
