name: Deploy Database
# Single entrypoint. A dispatch is an explicit authorization, not a claim that
# GitHub Environment reviewer rules exist. Existing environment rules still apply.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [staging, production]
        default: staging
        required: true
      source_sha:
        description: Exact current-main source SHA
        type: string
        required: true
      migration_manifest:
        description: Committed manifest path with ordered migration SHA-256 digests
        type: string
        required: true
      dry_run:
        description: Validate exact pending migrations without applying them
        type: boolean
        default: true
        required: true
      staging_run_id:
        description: Successful staging Deploy Database run for this source and manifest
        type: string
        required: false
      recovery_receipt:
        description: Committed sanitized backup-restore receipt (production only)
        type: string
        required: false
permissions:
  contents: read
  actions: read
jobs:
  deploy:
    uses: ./.github/workflows/database-deploy-reusable.yml
    with:
      environment: ${{ inputs.environment }}
      source_sha: ${{ inputs.source_sha }}
      migration_manifest: ${{ inputs.migration_manifest }}
      dry_run: ${{ inputs.dry_run }}
      staging_run_id: ${{ inputs.staging_run_id }}
      recovery_receipt: ${{ inputs.recovery_receipt }}
    secrets: inherit
