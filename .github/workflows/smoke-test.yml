# Post-Deploy Smoke Test — verify the public production experience.
#
# The workflow reports three independent signals:
#   1. application/build availability;
#   2. data-backend availability;
#   3. full product readiness.
#
# A protected, inaccessible, skipped, or non-2xx health endpoint is never
# considered full readiness.

name: Post-Deploy Smoke Test

on:
  deployment_status:
  workflow_dispatch:
    inputs:
      target_url:
        description: "Public URL to smoke test"
        required: true
        type: string

permissions:
  contents: read
  deployments: read

concurrency:
  group: smoke-test-${{ github.event.deployment.id || 'manual' }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Smoke Test
    runs-on: ubuntu-latest
    timeout-minutes: 5

    # Deployment events are evaluated only for production. Manual runs remain
    # available for deterministic checks of another public URL.
    if: >-
      (github.event_name == 'deployment_status' &&
       github.event.deployment_status.state == 'success' &&
       github.event.deployment_status.environment == 'Production') ||
      github.event_name == 'workflow_dispatch'

    env:
      TARGET_URL: ${{ github.event_name == 'deployment_status' && 'https://tryvit.vercel.app' || inputs.target_url }}
      DEPLOY_ENV: ${{ github.event_name == 'deployment_status' && 'Production' || 'manual' }}

    steps:
      - name: Checkout health evaluator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Wait for the production alias to stabilize
        if: ${{ github.event_name == 'deployment_status' }}
        run: sleep 30

      - name: Initialize report
        run: |
          if [ -z "$TARGET_URL" ]; then
            echo "::error::No public target URL is available"
            exit 1
          fi

          {
            echo "## Post-Deploy Smoke Test"
            echo ""
            echo "**Public target:** \`$TARGET_URL\`"
            echo "**Environment:** $DEPLOY_ENV"
            echo "**Time:** $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo ""
            echo "| Signal | Result |"
            echo "|--------|--------|"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Check application/build availability
        id: application
        run: |
          http_code=$(curl --silent --show-error --location --output /dev/null \
            --write-out "%{http_code}" --max-time 20 "$TARGET_URL/") || http_code="000"

          if [ "$http_code" -ge 200 ] && [ "$http_code" -lt 400 ]; then
            echo "| Application/build | ✅ Available (HTTP $http_code) |" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "| Application/build | ❌ Unavailable (HTTP $http_code) |" >> "$GITHUB_STEP_SUMMARY"
            echo "::error::Public application returned HTTP $http_code"
            exit 1
          fi

      - name: Check data-backend availability
        id: data_health
        if: ${{ always() }}
        run: |
          MAX_RETRIES=5
          RETRY_DELAY=15
          attempt=0
          http_code="000"
          : > /tmp/health_body.json

          while [ "$attempt" -lt "$MAX_RETRIES" ]; do
            attempt=$((attempt + 1))
            echo "Health check attempt $attempt/$MAX_RETRIES"
            http_code=$(curl --silent --show-error --output /tmp/health_body.json \
              --write-out "%{http_code}" --max-time 20 "$TARGET_URL/api/health") || http_code="000"

            if [ "$http_code" != "000" ]; then
              break
            fi

            if [ "$attempt" -lt "$MAX_RETRIES" ]; then
              sleep "$RETRY_DELAY"
            fi
          done

          if python3 scripts/evaluate_health_response.py "$http_code" /tmp/health_body.json; then
            echo "| Data backend | ✅ Available (HTTP $http_code) |" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "| Data backend | ❌ Unavailable (HTTP $http_code) |" >> "$GITHUB_STEP_SUMMARY"
            echo "::error::Public health endpoint did not prove data-backend availability"
            exit 1
          fi

      - name: Check critical application routes
        id: routes
        if: ${{ always() }}
        run: |
          failed=0
          for route in "/app" "/app/scan"; do
            http_code=$(curl --silent --show-error --location --output /dev/null \
              --write-out "%{http_code}" --max-time 20 "$TARGET_URL$route") || http_code="000"

            if [ "$http_code" -ge 200 ] && [ "$http_code" -lt 400 ]; then
              echo "| Route \`$route\` | ✅ Available (HTTP $http_code) |" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "| Route \`$route\` | ❌ Unavailable (HTTP $http_code) |" >> "$GITHUB_STEP_SUMMARY"
              echo "::error::Route $route returned HTTP $http_code"
              failed=1
            fi
          done
          exit "$failed"

      - name: Report full product readiness
        if: ${{ always() }}
        env:
          APPLICATION_OUTCOME: ${{ steps.application.outcome }}
          DATA_HEALTH_OUTCOME: ${{ steps.data_health.outcome }}
          ROUTES_OUTCOME: ${{ steps.routes.outcome }}
        run: |
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ "$APPLICATION_OUTCOME" = "success" ] && \
             [ "$DATA_HEALTH_OUTCOME" = "success" ] && \
             [ "$ROUTES_OUTCOME" = "success" ]; then
            echo "✅ **Full product readiness: ready.**" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "⚠️ **Full product readiness: not ready.**" >> "$GITHUB_STEP_SUMMARY"
            echo "The website, data backend, and product routes are reported separately above." >> "$GITHUB_STEP_SUMMARY"
          fi
