<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="TryVit logomark">
  <title>TryVit</title>
  <desc>Rounded-squircle logomark with a stylized leaf and accent dot. Adapts to prefers-color-scheme.</desc>
  <defs>
    <linearGradient id="g-light" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1DB954"/>
      <stop offset="100%" stop-color="#0A2E1A"/>
    </linearGradient>
    <linearGradient id="g-dark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00E676"/>
      <stop offset="100%" stop-color="#1DB954"/>
    </linearGradient>
    <style>
      .bg { fill: url(#g-light); }
      .leaf { fill: #ffffff; fill-opacity: 0.96; }
      .midrib { stroke: #0A2E1A; opacity: 0.16; }
      .dot { fill: #00E676; }
      @media (prefers-color-scheme: dark) {
        .bg { fill: url(#g-dark); }
        .leaf { fill: #F0FAF4; }
        .midrib { opacity: 0.20; }
        .dot { fill: #0A2E1A; opacity: 0.85; }
      }
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="512" height="512" rx="120" ry="120"/>
  <path class="leaf" d="M 132 388 C 132 244, 244 144, 388 124 C 388 124, 380 252, 312 320 C 248 384, 176 388, 132 388 Z"/>
  <path class="midrib" d="M 132 388 C 200 320, 280 244, 388 124" stroke-width="14" stroke-linecap="round" fill="none"/>
  <circle class="dot" cx="388" cy="124" r="16"/>
</svg>