<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 380" role="img" aria-label="TryVit">
  <title>TryVit — Stacked Lockup (Dark Mode)</title>
  <desc>Dark-mode stacked lockup for vitDark (#0A2E1A) backgrounds. vitAccent-to-vitGreen logomark, vitLight wordmark.</desc>

  <defs>
    <linearGradient id="brand-fill-dark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00E676"/>
      <stop offset="100%" stop-color="#1DB954"/>
    </linearGradient>
  </defs>

  <!-- ═══ Logomark (dark mode, centered, 200×200) ═══ -->
  <svg x="60" y="20" width="200" height="200" viewBox="0 0 512 512">
    <rect x="0" y="0" width="512" height="512" rx="120" ry="120" fill="url(#brand-fill-dark)"/>
<path d="M 132 388 C 132 244, 244 144, 388 124 C 388 124, 380 252, 312 320 C 248 384, 176 388, 132 388 Z" fill="#ffffff" fill-opacity="0.96"/>
<path d="M 132 388 C 200 320, 280 244, 388 124" stroke="#0A2E1A" stroke-width="14" stroke-linecap="round" fill="none" opacity="0.18"/>
<circle cx="388" cy="124" r="16" fill="#00E676" opacity="0.90"/>
    <line x1="256" y1="84" x2="256" y2="440" stroke="#0f172a" stroke-width="3.5" opacity="0.25" stroke-linecap="round"/>
    <line x1="256" y1="176" x2="172" y2="236" stroke="#0f172a" stroke-width="2.5" opacity="0.18" stroke-linecap="round"/>
    <line x1="256" y1="176" x2="340" y2="236" stroke="#0f172a" stroke-width="2.5" opacity="0.18" stroke-linecap="round"/>
    <line x1="256" y1="256" x2="180" y2="312" stroke="#0f172a" stroke-width="2.5" opacity="0.18" stroke-linecap="round"/>
    <line x1="256" y1="256" x2="332" y2="312" stroke="#0f172a" stroke-width="2.5" opacity="0.18" stroke-linecap="round"/>
    <line x1="256" y1="336" x2="200" y2="380" stroke="#0f172a" stroke-width="2.5" opacity="0.18" stroke-linecap="round"/>
    <line x1="256" y1="336" x2="312" y2="380" stroke="#0f172a" stroke-width="2.5" opacity="0.18" stroke-linecap="round"/>
    <circle cx="256" cy="64" r="10" fill="#F0FAF4" opacity="0.90"/>
  </svg>

  <!-- ═══ Wordmark (vitLight, centered below) ═══ -->
  <text
    x="160" y="310"
    text-anchor="middle"
    font-family="'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif"
    font-size="34"
    font-weight="700"
    fill="#F0FAF4"
    letter-spacing="0.02em"
  >TryVit</text>
</svg>
