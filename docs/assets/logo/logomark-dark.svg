  <defs>
    <linearGradient id="brand-bg-dark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00E676"/>
      <stop offset="100%" stop-color="#1DB954"/>
    </linearGradient>
    <linearGradient id="brand-sheen-dark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12"/>
