  </defs>
  <rect x="0" y="0" width="512" height="512" rx="120" ry="120" fill="url(#brand-bg-dark)"/>
  <rect x="0" y="0" width="512" height="512" rx="120" ry="120" fill="url(#brand-sheen-dark)"/>
  <path d="M 132 388 C 132 244, 244 144, 388 124 C 388 124, 380 252, 312 320 C 248 384, 176 388, 132 388 Z" fill="#F0FAF4" fill-opacity="0.96"/>
